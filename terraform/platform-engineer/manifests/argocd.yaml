# Manifest 9: the Argo CD instance.
#
# The Argo CD Supervisor Service is part of VCF. This asks it for an
# instance. argocd.tf applies this file into the platform namespace; the
# namespace name is generated, so it is not set here.
apiVersion: argocd-service.vsphere.vmware.com/v1alpha1
kind: ArgoCD
metadata:
  name: argocd
spec:
  # A version the Argo CD Supervisor Service offers.
  version: 3.4.4+vmware.1-vks.1
  applicationSet:
    enabled: true

  # OIDC login. With a load balancer address, the service registers this
  # instance with VCF Automation as an OIDC relying party and writes the
  # issuer, client, and redirect URL into Argo CD. No oidc block is needed:
  # users of the org log in with "VCF Automation" on the Argo CD login page.
  enableLoadBalancer: true

  # OIDC decides who the user is. This decides what the user can do.
  rbac:
    scopes: "[groups, preferred_username, email]"
    defaultPolicy: role:readonly
    policy: |
      g, platform-admin, role:admin

  # Argo CD has no built-in health check for these kinds, and without one
  # it shows "Healthy" as soon as the object exists. Sync waves in
  # gitops/private-ai/ wait on these checks: database, then Private AI
  # Services, then the model.
  #
  # All three kinds report a Ready condition, so they share one script.
  # Ready is True: Healthy. Otherwise: Progressing, with the reason.
  #
  # It never reports Degraded. While DSM builds a database it sets
  # Provisioning to reason "Failed", and Private AI Services reports
  # "validationError" until its Secret exists. Both clear by themselves.
  resourceHealthChecks:
    - group: databases.dataservices.vmware.com
      kind: PostgresCluster
      check: &ready_condition |
        local hs = { status = "Progressing", message = "Waiting for status" }
        if obj.status == nil or obj.status.conditions == nil then
          return hs
        end
        local function text(condition)
          local reason = condition.reason or ""
          local message = condition.message or ""
          if message == "" then
            return reason ~= "" and reason or condition.type
          end
          return reason .. ": " .. message
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = text(condition)
              return hs
            end
            if condition.message ~= nil and condition.message ~= "" then
              hs.message = text(condition)
              return hs
            end
          end
        end
        -- Ready is not True and says nothing: use the first condition that
        -- explains itself.
        for _, condition in ipairs(obj.status.conditions) do
          if condition.status ~= "True" and condition.message ~= nil and condition.message ~= "" then
            hs.message = condition.type .. ": " .. condition.message
            return hs
          end
        end
        return hs
    - group: pais.vmware.com
      kind: PAISConfiguration
      check: *ready_condition
    - group: pais.vmware.com
      kind: ModelEndpoint
      check: *ready_condition
