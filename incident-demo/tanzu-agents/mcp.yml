# MCP doors for the Metal Music space.
# Short names k8s-mcp and vcf-mcp are already taken in org demo.
# python_buildpack, HTTP /health. Tokens are cf set-env.
---
applications:
  - name: metal-k8s-mcp
    memory: 256M
    disk_quota: 1G
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 60
    command: python k8s_mcp.py
    buildpacks:
      - python_buildpack
    routes:
      - route: metal-k8s-mcp.${TANZU_APPS_DOMAIN}
    services:
      - k8s-mcp-cluster
  - name: metal-avi-mcp
    memory: 256M
    disk_quota: 512M
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 60
    command: python server.py
    buildpacks:
      - python_buildpack
    routes:
      - route: metal-avi-mcp.${TANZU_APPS_DOMAIN}
  - name: metal-vcf-mcp
    memory: 1G
    disk_quota: 2G
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 120
    command: python -m vcf_mcp serve-http
    buildpacks:
      - python_buildpack
    routes:
      - route: metal-vcf-mcp.${TANZU_APPS_DOMAIN}
