# Applied only when CLM_IMAGE is set. See clm/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clm
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clm
  template:
    metadata:
      labels:
        app: clm
    spec:
      containers:
        - name: clm
          image: ${CLM_IMAGE}
          ports:
            - containerPort: 8700
          env:
            - name: CLM_MODEL
              value: clm-latest
          readinessProbe:
            httpGet:
              path: /health
              port: 8700
---
apiVersion: v1
kind: Service
metadata:
  name: clm
  namespace: metal-music-app-agentic-system
spec:
  selector:
    app: clm
  ports:
    - name: http
      port: 8700
      targetPort: 8700
