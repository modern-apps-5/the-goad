# Shape of the Secrets apply.py creates. Not applied.
# Values are blanks. Do not put a real token or password in this file.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: incident-tools
type: Opaque
stringData:
  password: ${GRAFANA_ADMIN_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: zammad-env
  namespace: incident-tools
type: Opaque
stringData:
  POSTGRESQL_HOST: zammad-postgresql
  POSTGRESQL_PORT: "5432"
  POSTGRESQL_USER: zammad
  POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
  POSTGRESQL_DB: zammad_production
  REDIS_URL: redis://zammad-redis:6379
  MEMCACHE_SERVERS: zammad-memcached:11211
  ELASTICSEARCH_ENABLED: "false"
  POSTGRESQL_DB_CREATE: "false"
  ZAMMAD_RAILSSERVER_HOST: 127.0.0.1
  ZAMMAD_RAILSSERVER_PORT: "3000"
  ZAMMAD_WEBSOCKET_HOST: 127.0.0.1
  ZAMMAD_WEBSOCKET_PORT: "6042"
  NGINX_PORT: "8080"
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  ZAMMAD_FQDN: ${ZAMMAD_HOST}
  ZAMMAD_HTTP_TYPE: https
  AUTOWIZARD_JSON: ${ZAMMAD_AUTOWIZARD_JSON}
---
apiVersion: v1
kind: Secret
metadata:
  name: avi-goad
  namespace: metal-music-app-agentic-system
type: Opaque
stringData:
  controller: ${AVI_CONTROLLER}
  username: ${AVI_USERNAME}
  password: ${AVI_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-auth
  namespace: metal-music-app-agentic-system
type: Opaque
stringData:
  read: ${MCP_READ_TOKEN}
  write: ${MCP_WRITE_TOKEN}
  vcf-read: ${VCF_READ_TOKEN}
  vcf-admin: ${VCF_ADMIN_TOKEN}
---
apiVersion: v1
kind: Secret
metadata:
  name: guest-kubeconfig
  namespace: metal-music-app-agentic-system
type: Opaque
stringData:
  config: ${GUEST_KUBECONFIG}
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-doors
  namespace: metal-music-app-agentic-system
type: Opaque
stringData:
  lb-client-id: ${LB_CLIENT_ID}
  lb-client-secret: ${LB_CLIENT_SECRET}
  lb-gateway: ${LB_GATEWAY}
  k8s-client-id: ${K8S_CLIENT_ID}
  k8s-client-secret: ${K8S_CLIENT_SECRET}
  k8s-gateway: ${K8S_GATEWAY}
  vcf-client-id: ${VCF_CLIENT_ID}
  vcf-client-secret: ${VCF_CLIENT_SECRET}
  vcf-gateway: ${VCF_GATEWAY}
---
apiVersion: v1
kind: Secret
metadata:
  name: qwen-model
  namespace: metal-music-app-agentic-system
type: Opaque
stringData:
  base-url: ${QWEN_BASE_URL}
  api-key: ${QWEN_API_KEY}
  model: qwen
---
apiVersion: v1
kind: Secret
metadata:
  name: zammad-api
  namespace: metal-music-app-agentic-system
type: Opaque
stringData:
  url: ${ZAMMAD_URL}
  token: ${ZAMMAD_TOKEN}
---
apiVersion: v1
kind: Secret
metadata:
  name: walk-targets
  namespace: metal-music-app-agentic-system
type: Opaque
stringData:
  store-url: ${STORE_URL}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-annotator
  namespace: metal-music-app-agentic-system
type: Opaque
stringData:
  password: ${GRAFANA_ADMIN_PASSWORD}
