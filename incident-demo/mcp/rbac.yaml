apiVersion: v1
kind: ServiceAccount
metadata:
  name: goad-k8s-mcp
  namespace: metal-music-app-agentic-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: goad-k8s-mcp-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: goad-k8s-mcp-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: goad-k8s-mcp-read
subjects:
  - kind: ServiceAccount
    name: goad-k8s-mcp
    namespace: metal-music-app-agentic-system
