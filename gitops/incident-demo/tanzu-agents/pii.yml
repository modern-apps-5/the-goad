# Scrubber. Emails and phone numbers. Not the GenAI tile webhook.
---
applications:
  - name: pii-scrub
    memory: 256M
    disk_quota: 512M
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 60
    command: python scrub.py
    buildpacks:
      - python_buildpack
    routes:
      - route: pii-scrub.${TANZU_APPS_DOMAIN}
