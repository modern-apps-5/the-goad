apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-push
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: harbor-push
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"depot.kube-system.svc":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: SUPERVISOR_NAMESPACE/platform-tools-harbor-push
