# What BuildKit needs to pull from and push to the Supervisor's Harbor.
#
# Inside VKS, Harbor is depot.kube-system.svc: the name the Supervisor
# registers it under, which nodes and pods resolve and nodes trust. A pod
# does not trust it, so BuildKit gets Harbor's CA from harbor-ca, with a
# buildkitd.toml that points at it.
#
# harbor-push is the push login of robot$music-store+builder, which can
# push and pull only in the project music-store (decision 47). Terraform
# writes the KV platform-tools-harbor-push from the GitHub secret
# MUSIC_STORE_HARBOR_ROBOT_SECRET (terraform/platform-engineer/secrets.tf).
# SUPERVISOR_NAMESPACE is a placeholder that the Application patches.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-ca
data:
  buildkitd.toml: |
    [registry."depot.kube-system.svc"]
      ca = ["/etc/buildkit/ca.crt"]
  ca.crt: |
