# The platform engineer's deploy: the shop's containers on the VKS cluster
# music-store. Argo CD syncs this directory with the Application
# music-store-dev-app into the namespace music-store.
#
# The storefront source lives in this directory: store, cart, order, and
# chat, run from source on python:3.12-slim, with /health on cart, order,
# and chat. Argo's kustomize will not load files outside this directory.
# The shop is published through Gateway API, not an Ingress: the Gateway
# metal-store in namespace default (gateway-metal-store.yaml), its
# HTTPRoute for music.goad.gpu.set.lab, and the Avi WAF L7Rule the route
# uses. AKO publishes the host name in Avi DNS. The Gateway's certificate
# comes from gitops/music-store-platform/gateway-cert.yaml.
#
# The users service and the catalog are not containers. services.yaml
# gives the containers the names they already call, postgres-service and
# users-service. The Job shop-endpoints in gitops/music-store-dev/users-vm
# writes the addresses. This directory does not contain Endpoints.
#
# store-db (the catalog password) and metal-oracle-model (the chat model's
# URL, API key and name) come from Secret Store through ESO, in
# external-secrets.yaml. No value is in git. Until ESO has written them the
# store and chat pods wait.
#
# cart-pvc and order-pvc stay mounted. The 1.0.63 sqlite files on those
# disks use different tables, so her cart and order open new files beside
# them. The old store PVC is not mounted by this shop.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - workloads.yaml
  - services.yaml
  - persistence.yaml
  - gateway-metal-store.yaml
  - httproute-metal-store-frontend.yaml
  - metal-store-waf-l7rule.yaml
  - external-secrets.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: store-src
    files:
      - app.py=src/store/app.py
      - requirements.txt=src/store/requirements.txt
  - name: cart-src
    files:
      - app.py=src/cart/app.py
      - requirements.txt=src/cart/requirements.txt
  - name: order-src
    files:
      - app.py=src/order/app.py
      - requirements.txt=src/order/requirements.txt
  - name: chat-src
    files:
      - app.py=src/chat/app.py
      - requirements.txt=src/chat/requirements.txt
  - name: store-covers
    files:
      - covers/Inflames_colony.jpeg
      - covers/Iron_Maiden-Somewhere_in_Time.jpg
      - covers/Metallica_-_...And_Justice_for_All_cover.jpg
      - covers/Pantera-VulgarDisplayofPower.jpg
      - covers/Sound_garden-Superunknown.jpg
      - covers/System_of_a_down-system_of_a_down.jpg

patches:
  - path: cart-persistence.yaml
  - path: order-persistence.yaml
  # Six covers do not fit in a client-side last-applied annotation.
  # Her own apply path uses server-side apply for the same reason.
  - target:
      kind: ConfigMap
      name: store-covers
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: mgmt-cl01-optimal-datastore-default-policy-autoraid
