# The names the containers call for the users VM and the catalog, which
# run in the Supervisor Namespace, not in this cluster.
#
# The Services have no selector. Their Endpoints are not in git: the Job
# shop-endpoints in gitops/music-store-dev/users-vm writes the addresses, the users
# VM's load balancer and the catalog's DSM address. Nothing here is an
# address.
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  ports:
    - name: http
      port: 5003
      targetPort: 5003
