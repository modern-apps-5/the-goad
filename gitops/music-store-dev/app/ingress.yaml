# One hostname for the shop. The Service it calls is music-store-1-service
# from agentic/store/workloads.yaml, in this same namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metal-store
  annotations:
    ako.vmware.com/service-engine-group: goad-se-group
    external-dns.alpha.kubernetes.io/hostname: music.goad.gpu.set.lab
spec:
  ingressClassName: avi-lb
  rules:
    - host: music.goad.gpu.set.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: music-store-1-service
                port:
                  number: 5000
