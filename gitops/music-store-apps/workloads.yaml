# Storefront, cart, orders, and chat, from the images the platform
# engineer's pipeline builds from apps/music-store (decision 48).
# kustomization.yaml sets their tag.
# Users and the catalog are Service names from backing.yaml.
# Chat model values come from secret metal-oracle-model.
# No Postgres deployment: postgres-service already points at the DSM catalog.
apiVersion: v1
kind: Service
metadata:
  name: cart-service
spec:
  selector:
    app: cart-service
  ports:
    - name: http
      port: 5002
      targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  selector:
    app: chat-service
  ports:
    - name: http
      port: 5005
      targetPort: 5005
---
apiVersion: v1
kind: Service
metadata:
  name: music-store-1-service
spec:
  selector:
    app: music-store-1
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
        app-name: music-store
        service-name: cart
        env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cart
          image: depot.kube-system.svc/music-store/cart
          env:
            - name: ORDER_SERVICE_URL
              value: http://order-service:5001
          ports:
            - containerPort: 5002
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app-name: music-store
        service-name: order
        env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order
          image: depot.kube-system.svc/music-store/order
          env:
            - name: ORDER_DB_PATH
              value: /tmp/orders.db
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
        app-name: music-store
        service-name: chat
        env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat
          image: depot.kube-system.svc/music-store/chat
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: music_store
            - name: DB_USER
              value: music_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-db
                  key: password
            - name: ORDER_SERVICE_URL
              value: http://order-service:5001
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: metal-oracle-model
                  key: base-url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metal-oracle-model
                  key: api-key
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: metal-oracle-model
                  key: model
            # The model's certificate is from the GOAD CA (goad-ca.crt).
            # OPENAI_TLS_VERIFY is for images before OPENAI_CA_FILE; remove
            # it once the chat image is newer than ff4cf83e2310.
            - name: OPENAI_CA_FILE
              value: /etc/goad-ca/ca.crt
            - name: OPENAI_TLS_VERIFY
              value: "false"
          volumeMounts:
            - name: goad-ca
              mountPath: /etc/goad-ca
              readOnly: true
          ports:
            - containerPort: 5005
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: goad-ca
          configMap:
            name: goad-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-store-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: music-store-1
  template:
    metadata:
      labels:
        app: music-store-1
        app-name: music-store
        service-name: store
        env: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: store
          image: depot.kube-system.svc/music-store/store
          env:
            - name: CART_SERVICE_URL
              value: http://cart-service:5002
            - name: ORDER_SERVICE_URL
              value: http://order-service:5001
            - name: USERS_SERVICE_URL
              value: http://users-service:5003
            - name: CHAT_SERVICE_URL
              value: http://chat-service:5005
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: music_store
            - name: DB_USER
              value: music_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-db
                  key: password
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 15
            timeoutSeconds: 120
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
