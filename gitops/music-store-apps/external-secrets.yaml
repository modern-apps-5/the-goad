# The shop's two Secrets, from Secret Store through the platform
# engineer's ClusterSecretStore secret-store (decision 38). Terraform
# writes the KVs from GitHub secrets; nothing here is a value.
#
# The key is <supervisor namespace>/<KV name>. SUPERVISOR_NAMESPACE is a
# placeholder that the Application music-store-apps patches from
# Terraform (terraform/platform-engineer/gitops.tf). dataFrom copies every
# key of the KV: store-db gets password, metal-oracle-model gets
# base-url, api-key and model.
#
# Pods read env only at start. After a KV changes, restart the store and
# chat Deployments.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: store-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: store-db
  dataFrom:
    - extract:
        key: SUPERVISOR_NAMESPACE/music-store-catalog
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metal-oracle-model
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: metal-oracle-model
  dataFrom:
    - extract:
        key: SUPERVISOR_NAMESPACE/music-store-chat
