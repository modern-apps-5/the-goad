# How the VKS cluster agents reads Secret Store, the same way as the
# platform tools cluster (gitops/platform-tools-apps/secret-store.yaml,
# decisions 38 and 42). The vault-injector addon gives the cluster the
# Service, the CA Secret and the token reviewer ESO needs. No address and
# no certificate are in git.
#
# Secret Store's role for the cluster reads only KVs whose name starts
# with agents. SUPERVISOR_NAMESPACE is a placeholder that the Application
# agents-platform patches from Terraform
# (terraform/platform-engineer/gitops.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-store-reader
  namespace: default
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secret-store
  annotations:
    # ESO's CRDs arrive with the addon, after the cluster is up.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: https://secret-store-service.vks-vault-injector.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: server-cert
        namespace: vks-vault-injector
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-SUPERVISOR_NAMESPACE-agents
          role: SUPERVISOR_NAMESPACE-agents
          serviceAccountRef:
            name: secret-store-reader
            namespace: default
