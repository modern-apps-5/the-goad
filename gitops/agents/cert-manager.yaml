# cert-manager on the VKS cluster agents, from the VKS addon, for the
# certificate of the kagent UI's Gateway (gitops/agents-platform). It
# selects clusters in this Supervisor Namespace by label; cluster.yaml
# carries the label.
#
# The release is pinned. A ClusterAddon does not move to a newer release
# by itself.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: cert-manager
spec:
  addonRef:
    name: cert-manager
  releaseFilter:
    ref:
      name: cert-manager.kubernetes.vmware.com.1.21.2-vmware.1-vks.1
  crossNamespaceSelection: Blocked
  stopMatchingBehavior: Delete
  clusters:
    - selector:
        matchLabels:
          addons.kubernetes.vmware.com/cert-manager: enabled
