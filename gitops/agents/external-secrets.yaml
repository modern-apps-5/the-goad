# External Secrets Operator on the VKS cluster agents, from the VKS addon,
# as on the platform tools cluster (gitops/platform-tools). It writes the
# Secret with kagent's Private AI Services key (gitops/agents-platform).
# It selects clusters in this Supervisor Namespace by label; cluster.yaml
# carries the label. Default values: ESO reaches Secret Store through the
# Service that the vault-injector addon already makes in the cluster
# (decision 38).
#
# The release is pinned. A ClusterAddon does not move to a newer release
# by itself.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: external-secrets
spec:
  addonRef:
    name: external-secrets
  releaseFilter:
    ref:
      name: external-secrets.2.11.0-vmware.1-vks.1
  crossNamespaceSelection: Blocked
  stopMatchingBehavior: Delete
  clusters:
    - selector:
        matchLabels:
          addons.kubernetes.vmware.com/external-secrets: enabled
