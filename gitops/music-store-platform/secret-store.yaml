# How the VKS cluster music-store reads Secret Store (decision 38).
#
# The vault-injector addon already gives every cluster what ESO needs:
# - the Service secret-store-service in vks-vault-injector, whose
#   Endpoints are the Secret Store load balancer, and whose name is in the
#   server certificate;
# - the Secret server-cert in vks-vault-injector, with that certificate;
# - kube-system/openbao-auth, the token reviewer, so the ServiceAccount
#   below needs no system:auth-delegator binding.
# No address and no certificate are in git.
#
# Secret Store makes one Kubernetes auth mount and role per cluster,
# kubernetes-<supervisor namespace>-<cluster> and
# <supervisor namespace>-<cluster>, and the role reads only KVs whose
# name starts with the cluster name. SUPERVISOR_NAMESPACE is a
# placeholder that the Application music-store-platform patches from
# Terraform (terraform/platform-engineer/gitops.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-store-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secret-store
  annotations:
    # ESO's CRDs arrive with the addon, after the cluster is up.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: https://secret-store-service.vks-vault-injector.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: server-cert
        namespace: vks-vault-injector
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-SUPERVISOR_NAMESPACE-music-store
          role: SUPERVISOR_NAMESPACE-music-store
          serviceAccountRef:
            name: secret-store-reader
            namespace: secret-store
