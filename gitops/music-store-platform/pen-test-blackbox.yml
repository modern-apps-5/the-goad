# Probe modules of the pen test's blackbox exporter (pen-test.yaml). The
# lab's certificates are signed by lab CAs the image does not trust, so
# TLS is not verified.
modules:
  # Checks 1 and 2, around Avi. An HTTP GET to the store, so the board can
  # show the status code when one gets through. The default deny drops the
  # SYN, so a pass is no answer: status code 0. The pass is decided in
  # rules.yml from the code, not from probe_success.
  pen_test_around:
    prober: http
    timeout: 25s
    http:
      preferred_ip_protocol: ip4
  # Checks 3 and 4, attacks through Avi. Up only when the WAF answers 403.
  pen_test_waf:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [403]
      tls_config:
        insecure_skip_verify: true
  # Check 5, a clean request through Avi. Store pages are slowed by 10
  # seconds during the walk; the timeout leaves room for that.
  pen_test_clean:
    prober: http
    timeout: 25s
    http:
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
  # Check 6, a CVE-2021-41773 exploit to the users VM, east-west. vDefend
  # Distributed IDPS on the VM's vNIC resets the connection when the
  # virtual patch is on (terraform/security-admin/idps.tf). A reset is
  # status code 0 and fails fast; the short timeout keeps a VM that does
  # not answer apart from a reset, in rules.yml.
  pen_test_vpatch:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
