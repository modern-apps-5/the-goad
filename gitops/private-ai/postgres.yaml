# The database for Private AI Services, from Data Services Manager (DSM).
#
# DSM creates the Secret pg-pais-db in this namespace, with the keys
# password and ca.crt. Private AI Services reads both.
apiVersion: databases.dataservices.vmware.com/v1alpha1
kind: PostgresCluster
metadata:
  name: pais-db
  annotations:
    # First wave. Private AI Services (wave 1) needs this database, and
    # the model (wave 2) needs Private AI Services: see pais.yaml.
    argocd.argoproj.io/sync-wave: "0"
spec:
  version: 16.14+vmware.v9.1.1.0
  databaseName: pais
  adminUsername: pgadmin
  # One node, no replica.
  replicas: 0
  # DSM refuses a class under 4 CPU for PostgreSQL. This is the smallest
  # that passes: 4 vCPU, 16 GB.
  vmClass:
    name: best-effort-large
  storageSpace: 20Gi
  storagePolicyName: MGMT-cl01 - Optimal Datastore Default Policy - AutoRAID
  # The DSM policy for the org must allow this infrastructure policy.
  infrastructurePolicy:
    name: dsm-infra-xscl5
