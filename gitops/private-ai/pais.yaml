# Private AI Services, and one model.
#
# Sync order, by sync wave:
#   0  the database (postgres.yaml), its Service, the Harbor CA below, and
#      the ingress certificate (ingress.yaml)
#   1  the Job that points the Service at the database
#      (database-service.yaml)
#   2  Private AI Services
#   3  the model, and the Gateway that gives it the name
#      pais.goad.gpu.set.lab (ingress.yaml)
# Argo CD starts a wave only when the wave before it is healthy. The
# health checks that make that true for these kinds are in
# terraform/platform-engineer/manifests/argocd.yaml.

# The CA of the Supervisor's Harbor registry. The model and its engine
# image are pulled from there.
