---
apiVersion: pais.vmware.com/v1alpha1
kind: PAISConfiguration
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    pais.vmware.com/default-failure-domain: west-1
spec:
  # The database from postgres.yaml, by the name of its Service: see
  # database-service.yaml. DSM creates the Secret pg-pais-db, with the
  # password and the CA.
  database:
    host: pais-db
    port: 5432
    dbname: pais
    username: pgadmin
    passwordRef:
      name: pg-pais-db
      fieldPath: password
    sslMode: VerifyFull
  # One local administrator. terraform/platform-engineer creates the
  # Secret; a password hash does not belong in git.
  auth:
    providers:
      - name: sc
        staticCredentials:
          credentialsSecretRef:
            name: pais-static-credentials
            key: credentials.json
          apiTokens:
            expirationDefault: 8760h
            expirationMax: 8760h
  clientTls:
    caBundleRefs:
      - kind: ConfigMap
        name: supervisor-harbor-ca
  # The ingress serves the GOAD CA's certificate (ingress.yaml), not one
  # PAIS makes. Clients reach it as pais.goad.gpu.set.lab, through the
  # Gateway pais.
  ingress:
    serviceType: LoadBalancer
    tlsSecretRef:
      name: pais-ingress-tls
  defaultStorageClassName: mgmt-cl01-optimal-datastore-default-policy-autoraid
  observability:
    prometheusRuntime:
      metricsRetention: 7d
      storageClassName: mgmt-cl01-optimal-datastore-default-policy-autoraid
  upgradeStrategy:
    automatic: {}
  # The smallest control plane that runs: 2 vCPU, 8 GB.
  vksControlPlane:
    virtualMachineClassName: best-effort-medium
    storageClassName: mgmt-cl01-optimal-datastore-default-policy-autoraid
---
# Qwen 2.5 Instruct, 14B, Q4_K_M, on CPU: 4 vCPU, 32 GB. No GPU.
#
# The name is the model and the class: qwen-<size>-<class>. Neither can
# change on an existing endpoint, so changing either one means a new
# name. Argo CD then creates the new endpoint and prunes the old one.
# Every other field changes in place.
#
# Clients call routingName qwen, which does not change. While both
# endpoints exist, PAIS routes qwen to the old one and marks the new
# one's InferenceGatewayRoute NameConflict. PruneLast holds the prune
# until the new endpoint is Ready (Argo CD's ModelEndpoint health check),
# so qwen keeps answering during the model load.
apiVersion: pais.vmware.com/v1alpha1
kind: ModelEndpoint
metadata:
  name: qwen-14b-xlarge
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  type: Completions
  routingName: qwen
  engine: LlamaCPP
  replicas: 1
  # Part of the name. Cannot be changed on an existing endpoint.
  virtualMachineClassName: best-effort-xlarge
  storageClassName: mgmt-cl01-optimal-datastore-default-policy-autoraid
  model:
    ociRef: depot.kube-system.svc/pais/qwen/qwen2.5-14b-instruct-gguf:v1.0
  inferenceServerCustomization:
    engineImage: depot.kube-system.svc/pais/3rd-party/model-runtime-engines@sha256:86475a113d75b25693b209d6df77b8af9316afee7284d9bdf02a5a4a3a3f52d5
    engineImageCompressedSize: 15Gi
    sharedMemoryMountSize: 1Gi
    tempMountSize: 1Gi
