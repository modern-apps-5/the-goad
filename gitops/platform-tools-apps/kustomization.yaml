# What runs in the platform tools cluster (decision 42). Argo CD syncs it
# with the Application platform-tools-apps into the namespace
# incident-tools. The Application patches in the generated Supervisor
# Namespace name (terraform/platform-engineer/gitops.tf).
#
# The incident demo's tools: Zammad, Grafana with its boards and the
# topology panel, Prometheus and the blackbox exporter. Their secrets come
# from Secret Store through ESO, in external-secrets.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: incident-tools

resources:
  - secret-store.yaml
  - external-secrets.yaml
  - zammad.yaml
  - grafana.yaml
  - prometheus.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/can-i-demo.json
      - dashboards/goad-architecture.json
      - dashboards/incident-live.json
      - dashboards/no-gpu.json
      - dashboards/vcfops-dqs-test.json
  # Grafana loads it as an unsigned plugin
  # (GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS in grafana.yaml).
  - name: goad-topology
    files:
      - topology/plugin.json
      - topology/module.js
      - topology/logo.svg
  - name: prometheus-config
    files:
      - prometheus.yml
      - rules.yml
  - name: blackbox-config
    files:
      - blackbox.yml
