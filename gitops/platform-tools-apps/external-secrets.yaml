# The tools' three Secrets, from Secret Store through the ClusterSecretStore
# secret-store (decisions 38 and 42). Terraform writes the KVs
# platform-tools-grafana, platform-tools-zammad and platform-tools-qwen
# (terraform/platform-engineer/secrets.tf); nothing here is a value.
#
# The key is <supervisor namespace>/<KV name>. SUPERVISOR_NAMESPACE is a
# placeholder that the Application platform-tools-apps patches from
# Terraform (terraform/platform-engineer/gitops.tf).
#
# Pods read env only at start. After a KV changes, restart the Deployment
# that reads it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: SUPERVISOR_NAMESPACE/platform-tools-grafana
---
# Zammad's whole environment. Only the database password and the first
# admin's password come from the KV; the rest is fixed here. Zammad reads
# AUTOWIZARD_JSON on its first start only, to create the admin user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zammad-env
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: zammad-env
    template:
      engineVersion: v2
      data:
        POSTGRESQL_HOST: zammad-postgresql
        POSTGRESQL_PORT: "5432"
        POSTGRESQL_USER: zammad
        POSTGRESQL_PASS: '{{ index . "db-password" }}'
        POSTGRESQL_DB: zammad_production
        POSTGRESQL_DB_CREATE: "false"
        REDIS_URL: redis://zammad-redis:6379
        MEMCACHE_SERVERS: zammad-memcached:11211
        ELASTICSEARCH_ENABLED: "false"
        ZAMMAD_RAILSSERVER_HOST: 127.0.0.1
        ZAMMAD_RAILSSERVER_PORT: "3000"
        ZAMMAD_WEBSOCKET_HOST: 127.0.0.1
        ZAMMAD_WEBSOCKET_PORT: "6042"
        NGINX_PORT: "8080"
        RAILS_ENV: production
        RAILS_LOG_TO_STDOUT: "true"
        ZAMMAD_FQDN: zammad.goad.gpu.set.lab
        ZAMMAD_HTTP_TYPE: http
        AUTOWIZARD_JSON: >-
          {{ dict "Users" (list (dict "login" "admin" "firstname" "On" "lastname" "Call" "email" "admin@goad.gpu.set.lab" "password" (index . "admin-password") "roles" (list "Admin" "Agent"))) | toJson | b64enc }}
  dataFrom:
    - extract:
        key: SUPERVISOR_NAMESPACE/platform-tools-zammad
---
# The blackbox exporter's Qwen check: the API key it sends, and the target
# file Prometheus reads, which holds the models URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qwen-probe
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: qwen-probe
    template:
      engineVersion: v2
      data:
        api-key: '{{ index . "api-key" }}'
        targets.json: >-
          [{"targets": ["{{ index . "base-url" }}/models"], "labels": {"id": "qwen", "check": "qwen"}}]
  dataFrom:
    - extract:
        key: SUPERVISOR_NAMESPACE/platform-tools-qwen
