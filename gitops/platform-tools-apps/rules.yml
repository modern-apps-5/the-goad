# The series the boards read, from the blackbox probes here and the ones
# the music store agent writes. A target's id is its box on the
# architecture board; its check is its tile on "Can I demo right now?".
groups:
  - name: goad
    rules:
      - record: demo_up
        expr: max by (check) (probe_success{check!=""})
      - record: demo_latency_ms
        expr: max by (check) (probe_duration_seconds{check!=""}) * 1000
      - record: arch_latency_ms
        expr: max by (id) (probe_duration_seconds{id!=""}) * 1000
      # The pen test's checks, from the probes in namespace pen-test of the
      # music store cluster (gitops/music-store-platform/pen-test.yaml).
      # 1 when a check comes out as decision 49 wants: around Avi, no
      # answer (status code 0); through Avi, the code in expect. Check 6,
      # the CVE exploit to the users VM, passes only when vDefend IDPS
      # resets it: no status code, and the probe ends in under 5 seconds, so a
      # VM that is down and times out is not a pass. It fails while the
      # virtual patch is off (demos/vdefend-virtual-patching).
      - record: pen_test_pass
        expr: >-
          max by (pen_test) (probe_http_status_code{pen_test!="", expect="drop"} == bool 0)
          or max by (pen_test) (
            (probe_http_status_code{pen_test!="", expect="reset"} == bool 0)
            * on (pen_test, instance) (probe_duration_seconds{pen_test!="", expect="reset"} < bool 5)
          )
          or max by (pen_test) (probe_success{pen_test!="", expect!~"drop|reset"})
      # The HTTP status code each check got, 0 for no answer. The board
      # shows it on the checks.
      - record: pen_test_status_code
        expr: max by (pen_test) (probe_http_status_code{pen_test!=""})
      # music-nodes is up only when every node of the music store cluster
      # is Ready.
      - record: arch_up
        expr: >-
          max by (id) (probe_success{id!=""})
          or label_replace(min(kube_node_status_condition{cluster="music-store", condition="Ready", status="true"}), "id", "music-nodes", "", "")
