# Prometheus and the blackbox exporter. Their configuration files are in
# this directory; kustomization.yaml makes their ConfigMaps.
#
# Prometheus keeps two days on its own disk. It also receives remote writes
# from the agent on the music store cluster, through the Ingress below. The
# receiver has no authentication: anything on the lab network can write
# series to it (decision 42).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: mgmt-cl01-optimal-datastore-default-policy-autoraid
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: qwen
              mountPath: /etc/prometheus/qwen
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: qwen
          secret:
            secretName: qwen-probe
            items:
              - key: targets.json
                path: targets.json
        - name: data
          persistentVolumeClaim:
            claimName: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
# Where the music store agent writes: /api/v1/write on this name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  annotations:
    ako.vmware.com/service-engine-group: goad-se-group
    external-dns.alpha.kubernetes.io/hostname: prometheus.goad.gpu.set.lab
spec:
  ingressClassName: avi-lb
  rules:
    - host: prometheus.goad.gpu.set.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox
  template:
    metadata:
      labels:
        app: blackbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.25.0
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          ports:
            - containerPort: 9115
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9115
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
            - name: qwen
              mountPath: /etc/blackbox/qwen
      volumes:
        - name: config
          configMap:
            name: blackbox-config
        - name: qwen
          secret:
            secretName: qwen-probe
            items:
              - key: api-key
                path: api-key
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
spec:
  selector:
    app: blackbox
  ports:
    - name: http
      port: 9115
      targetPort: 9115
