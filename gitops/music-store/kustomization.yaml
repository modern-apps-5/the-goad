# The music store's part in the music-store Supervisor Namespace: the
# VKS cluster, the catalog, the users VM, and the Job that points the
# cluster at the last two. A kustomization so that the Application
# music-store can patch in the generated namespace name, which
# catalog-init needs for Secret Store (terraform/platform-engineer/gitops.tf).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster.yaml
  - catalog.yaml
  - external-secrets.yaml
  - cert-manager.yaml
  - users-vm.yaml
  - shop-endpoints.yaml
