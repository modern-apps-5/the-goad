# External Secrets Operator on the VKS cluster music-store, from the VKS
# addon. It selects clusters in this Supervisor Namespace by label, the
# way the dev-1 namespace in the lab installs it; cluster.yaml carries
# the label. Default values: ESO reaches Secret Store through the Service
# that the vault-injector addon already makes in the cluster, so it needs
# no address or host alias (decision 38).
#
# The release is pinned. A ClusterAddon does not move to a newer release
# by itself.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  addonRef:
    name: external-secrets
  releaseFilter:
    ref:
      name: external-secrets.2.11.0-vmware.1-vks.1
  crossNamespaceSelection: Blocked
  stopMatchingBehavior: Delete
  clusters:
    - selector:
        matchLabels:
          addons.kubernetes.vmware.com/external-secrets: enabled
