# The addresses behind users-service and postgres-service in the VKS
# cluster music-store, where gitops/music-store-apps runs the shop's
# containers.
#
# The users VM and the catalog run in this Supervisor Namespace, and the
# containers cannot see its Services. This Job reads the two addresses
# here, the users VM's load balancer and the Endpoints that the platform
# engineer's catalog-endpoints Job wrote (gitops/music-store/catalog.yaml), and writes them as Endpoints into the namespace music-store of
# the cluster. It reaches the cluster with the kubeconfig Secret that VKS
# creates next to the Cluster. No address is in git.
#
# Wave 3, after the users VM and the cluster in wave 0, and the catalog's
# Endpoints in wave 1. Argo CD holds this wave until the Cluster is
# healthy, so backoffLimit 12 only covers the VM's load balancer address
# coming late. It creates the namespace music-store in the cluster if
# music-store-apps has not yet.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["music-store-kubeconfig"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["postgres-service"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["users-service"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-endpoints
subjects:
  - kind: ServiceAccount
    name: shop-endpoints
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shop-endpoints
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 12
  template:
    spec:
      serviceAccountName: shop-endpoints
      restartPolicy: OnFailure
      containers:
        - name: write-endpoints
          image: alpine/k8s:1.34.1
          resources:
            requests: { cpu: "0", memory: "0" }
            limits: { cpu: 500m, memory: 256Mi }
          command: ["bash", "-euo", "pipefail", "-c"]
          args:
            - |
              catalog=$(kubectl get endpoints postgres-service -o jsonpath='{.subsets[0].addresses[0].ip}')
              users=$(kubectl get service users-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              [ -n "$catalog" ] || { echo "postgres-service has no address yet"; exit 1; }
              [ -n "$users" ] || { echo "users-service has no address yet"; exit 1; }
              echo "catalog is at $catalog, users is at $users"
              kubectl get secret music-store-kubeconfig -o jsonpath='{.data.value}' | base64 -d > /tmp/kubeconfig
              export KUBECONFIG=/tmp/kubeconfig
              kubectl create namespace music-store --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -n music-store -f - <<EOF
              apiVersion: v1
              kind: Endpoints
              metadata:
                name: postgres-service
              subsets:
                - addresses:
                    - ip: $catalog
                  ports:
                    - name: postgres
                      port: 5432
              ---
              apiVersion: v1
              kind: Endpoints
              metadata:
                name: users-service
              subsets:
                - addresses:
                    - ip: $users
                  ports:
                    - name: http
                      port: 5003
              EOF
