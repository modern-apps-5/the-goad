# The shop catalog, from Data Services Manager.
#
# Same shape as gitops/private-ai/postgres.yaml and
# database-service.yaml. DSM assigns the address. The Service name
# postgres-service is the DB_HOST the shop already uses. Nothing here
# is an organization name or an address.
#
# The Service has no selector. The first Job writes the address DSM
# assigned into the Service's Endpoints. The second Job creates the
# shop user and loads the six albums when the table is empty.
#
# The shop user's password is not in git. Terraform writes it from a
# GitHub secret into the KeyValueSecret music-store-catalog, in Secret
# Store. catalog-init reads it through the Supervisor's vault injector and
# sets it on the role on every sync. In the VKS cluster, ESO reads the same
# KV as the Secret store-db (decision 38).
#
# SUPERVISOR_NAMESPACE below is a placeholder. The namespace name is
# generated, so the Application music-store patches it in from Terraform
# (terraform/platform-engineer/gitops.tf).
apiVersion: databases.dataservices.vmware.com/v1alpha1
kind: PostgresCluster
metadata:
  name: catalog
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  version: 16.14+vmware.v9.1.1.0
  databaseName: music_store
  dnsNames:
    - postgres-service
  adminUsername: pgadmin
  replicas: 0
  vmClass:
    name: best-effort-large
  storageSpace: 20Gi
  storagePolicyName: MGMT-cl01 - Optimal Datastore Default Policy - AutoRAID
  infrastructurePolicy:
    name: dsm-infra-xscl5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["databases.dataservices.vmware.com"]
    resources: ["postgresclusters"]
    resourceNames: ["catalog"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: catalog-endpoints
subjects:
  - kind: ServiceAccount
    name: catalog-endpoints
---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-endpoints
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: catalog-endpoints
      restartPolicy: OnFailure
      containers:
        - name: write-endpoints
          image: alpine/k8s:1.34.1
          resources:
            requests: { cpu: "0", memory: "0" }
            limits: { cpu: 500m, memory: 256Mi }
          command: ["bash", "-euo", "pipefail", "-c"]
          args:
            - |
              address=$(kubectl get postgrescluster catalog -o jsonpath='{.status.connection.host}')
              [ -n "$address" ] || { echo "catalog has no address yet"; exit 1; }
              echo "catalog is at $address"
              kubectl apply -f - <<EOF
              apiVersion: v1
              kind: Endpoints
              metadata:
                name: postgres-service
              subsets:
                - addresses:
                    - ip: $address
                  ports:
                    - name: postgres
                      port: 5432
              EOF
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-init
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  init.sql: |
    \set music_user_password `cat /vault/secrets/catalog`
    SELECT 'CREATE ROLE music_user LOGIN'
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'music_user') \gexec
    ALTER ROLE music_user PASSWORD :'music_user_password';
    GRANT ALL ON DATABASE music_store TO music_user;
    GRANT USAGE, CREATE ON SCHEMA public TO music_user;
    CREATE TABLE IF NOT EXISTS albums (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        artist VARCHAR(255) NOT NULL,
        price DECIMAL(10,2) NOT NULL,
        cover_url TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        album_id INTEGER NOT NULL,
        quantity INTEGER NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (album_id) REFERENCES albums(id) ON DELETE CASCADE
    );
    CREATE INDEX IF NOT EXISTS idx_albums_artist ON albums(artist);
    CREATE INDEX IF NOT EXISTS idx_albums_price ON albums(price);
    CREATE INDEX IF NOT EXISTS idx_orders_album_id ON orders(album_id);
    CREATE INDEX IF NOT EXISTS idx_orders_created_at ON orders(created_at);
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ language 'plpgsql';
    DROP TRIGGER IF EXISTS update_albums_updated_at ON albums;
    CREATE TRIGGER update_albums_updated_at
        BEFORE UPDATE ON albums
        FOR EACH ROW
        EXECUTE FUNCTION update_updated_at_column();
    INSERT INTO albums (name, artist, price, cover_url)
    SELECT name, artist, price, cover_url
    FROM (VALUES
        ('Vulgar Display of Power', 'Pantera', 24.99, '/static/covers/Pantera-VulgarDisplayofPower.jpg'),
        ('...And Justice for All', 'Metallica', 22.99, '/static/covers/Metallica_-_...And_Justice_for_All_cover.jpg'),
        ('Superunknown', 'Soundgarden', 21.99, '/static/covers/Sound_garden-Superunknown.jpg'),
        ('Colony', 'In Flames', 19.99, '/static/covers/Inflames_colony.jpeg'),
        ('System of a Down', 'System of a Down', 20.99, '/static/covers/System_of_a_down-system_of_a_down.jpg'),
        ('Somewhere in Time', 'Iron Maiden', 23.99, '/static/covers/Iron_Maiden-Somewhere_in_Time.jpg')
    ) AS seed(name, artist, price, cover_url)
    WHERE NOT EXISTS (SELECT 1 FROM albums);
    GRANT ALL ON ALL TABLES IN SCHEMA public TO music_user;
    GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO music_user;
    ALTER TABLE IF EXISTS albums OWNER TO music_user;
    ALTER TABLE IF EXISTS orders OWNER TO music_user;
    ALTER SEQUENCE IF EXISTS albums_id_seq OWNER TO music_user;
    ALTER SEQUENCE IF EXISTS orders_id_seq OWNER TO music_user;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 6
  template:
    metadata:
      # The Supervisor's vault injector writes the password to
      # /vault/secrets/catalog before psql starts. Pre-populate only: no
      # sidecar, so the Job can finish. Requests 0: a vSphere Pod's
      # requests are reservations, and this namespace has none. The
      # default agent image's registry does not resolve in the lab.
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-requests-cpu: "0"
        vault.hashicorp.com/agent-requests-mem: "0"
        vault.hashicorp.com/agent-image: quay.io/openbao/openbao:2.4.4
        vault.hashicorp.com/role: SUPERVISOR_NAMESPACE
        vault.hashicorp.com/agent-inject-secret-catalog: secret/data/SUPERVISOR_NAMESPACE/music-store-catalog
        vault.hashicorp.com/agent-inject-template-catalog: '{{ with secret "secret/data/SUPERVISOR_NAMESPACE/music-store-catalog" }}{{ .Data.data.password }}{{ end }}'
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:16-alpine
          resources:
            requests: { cpu: "0", memory: "0" }
            limits: { cpu: 500m, memory: 256Mi }
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-catalog
                  key: password
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /ca/ca.crt
          command: ["psql", "-h", "postgres-service", "-U", "pgadmin", "-d", "music_store", "-v", "ON_ERROR_STOP=1", "-f", "/sql/init.sql"]
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: ca
          secret:
            secretName: pg-catalog
            items:
              - key: ca.crt
                path: ca.crt
        - name: sql
          configMap:
            name: catalog-init
