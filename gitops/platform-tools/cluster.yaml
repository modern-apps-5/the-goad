# The platform's tools cluster: Zammad, Grafana and Prometheus for the
# incident demo, apart from the clusters they watch (decision 42).
#
# No namespace: Argo CD applies this into the platform-tools Supervisor
# Namespace. The class, the Kubernetes version, the VM classes and the
# storage class are the same as the music store cluster's
# (gitops/music-store/cluster.yaml). The Argo CD that VCF ships reports a
# Cluster Healthy only when it is ready.
#
# The platform engineer owns the cluster and what runs in it
# (gitops/platform-tools-apps).
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: platform-tools
  # external-secrets.yaml installs ESO on clusters with the second label.
  labels:
    addons.kubernetes.vmware.com/platform-observability: enabled
    addons.kubernetes.vmware.com/external-secrets: enabled
spec:
  # serviceDomain must be set: the helm-controller addon release new
  # clusters get (1.5.5) reads it in its template and fails without it, and
  # ESO waits on helm-controller. clusterNetwork cannot be changed after
  # the cluster is created.
  clusterNetwork:
    serviceDomain: cluster.local
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.36.2+vmware.2
    controlPlane:
      replicas: 1
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu,os-version=24.04
    workers:
      machineDeployments:
        - class: node-pool
          name: workers
          replicas: 1
          metadata:
            annotations:
              run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu,os-version=24.04
          variables:
            overrides:
              - name: vmClass
                value: best-effort-large
    variables:
      - name: vmClass
        value: best-effort-medium
      - name: storageClass
        value: mgmt-cl01-optimal-datastore-default-policy-autoraid
      - name: bootstrapAddons
        value:
          cniRef:
            name: antrea
            namespace: vmware-system-vks-public
