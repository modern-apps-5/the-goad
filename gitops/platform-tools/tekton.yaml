# The Tekton operator on the VKS cluster platform-tools, from the VKS
# addon, the same way as ESO in external-secrets.yaml. It builds the music
# store's images (decision 48). The operator installs nothing by itself:
# the TektonConfig in gitops/platform-tools-builds asks it for Tekton
# Pipelines.
#
# The release is pinned. A ClusterAddon does not move to a newer release
# by itself.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: tekton-operator
spec:
  addonRef:
    name: tekton-operator
  releaseFilter:
    ref:
      name: tekton-operator.0.80.0-vmware.1-vks.1
  crossNamespaceSelection: Blocked
  stopMatchingBehavior: Delete
  clusters:
    - selector:
        matchLabels:
          addons.kubernetes.vmware.com/tekton-operator: enabled
