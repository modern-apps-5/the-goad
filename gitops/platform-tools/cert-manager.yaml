# cert-manager on the VKS cluster platform-tools, from the VKS addon, the
# same release as the music store cluster's. The Tekton operator's chart
# (tekton.yaml) makes cert-manager Certificates for its webhooks and fails
# to install without it, though its addon does not list it as a
# dependency. cluster.yaml carries the label.
#
# The release is pinned. A ClusterAddon does not move to a newer release
# by itself.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: cert-manager
spec:
  addonRef:
    name: cert-manager
  releaseFilter:
    ref:
      name: cert-manager.kubernetes.vmware.com.1.21.2-vmware.1-vks.1
  crossNamespaceSelection: Blocked
  stopMatchingBehavior: Delete
  clusters:
    - selector:
        matchLabels:
          addons.kubernetes.vmware.com/cert-manager: enabled
