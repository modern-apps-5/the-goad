# Zammad for namespace zammad on cluster goad-store.
# DO NOT APPLY from this pull request.
# The earlier guest-cluster copy was evicted for low disk. Size disk
# before any later apply. Elasticsearch stays in this file. If it will
# not schedule, stop. Do not create a service engine group.
# Official images from the Zammad compose stack, as separate pods.
# The guest namespace enforces restricted pod security, and new vSAN
# volumes fail while the supervisor webhook is down. Disk is temporary.
# Do not treat temporary disk as the design.
# The database password is the public compose default.
apiVersion: v1
kind: Namespace
metadata:
  name: zammad
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-elasticsearch
  namespace: incident-tools
spec:
  selector:
    app: zammad-elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-postgresql
  namespace: incident-tools
spec:
  selector:
    app: zammad-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-redis
  namespace: incident-tools
spec:
  selector:
    app: zammad-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-memcached
  namespace: incident-tools
spec:
  selector:
    app: zammad-memcached
  ports:
    - name: memcached
      port: 11211
      targetPort: 11211
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-nginx
  namespace: incident-tools
spec:
  selector:
    app: zammad-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: zammad-elasticsearch
  namespace: incident-tools
  labels:
    app: zammad-elasticsearch
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: elasticsearch
      image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
      args:
        - -Enode.store.allow_mmap=false
        - -Ediscovery.type=single-node
        - -Expack.security.enabled=false
        - -Eingest.geoip.downloader.enabled=false
      env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 9200
      volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
      resources:
        requests:
          memory: 1Gi
        limits:
          memory: 2Gi
  volumes:
    - name: data
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: zammad-postgresql
  namespace: incident-tools
  labels:
    app: zammad-postgresql
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: postgresql
      image: postgres:17.11-alpine
      env:
        - name: POSTGRES_USER
          value: zammad
        - name: POSTGRES_PASSWORD
          value: ${ZAMMAD_DB_PASSWORD}
        - name: POSTGRES_DB
          value: zammad_production
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 70
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: data
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: zammad-redis
  namespace: incident-tools
  labels:
    app: zammad-redis
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: redis
      image: redis:7.4-alpine
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 999
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Pod
metadata:
  name: zammad-memcached
  namespace: incident-tools
  labels:
    app: zammad-memcached
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 11211
    runAsGroup: 11211
    fsGroup: 11211
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: memcached
      image: memcached:1.6.45-alpine
      args: ["-m", "256"]
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 11211
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 11211
---
apiVersion: v1
kind: Pod
metadata:
  name: zammad-app
  namespace: incident-tools
  labels:
    app: zammad-app
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: zammad-init
      image: ghcr.io/zammad/zammad:7.2.2-0000
      command: ["zammad-init"]
      envFrom:
        - secretRef:
            name: zammad-env
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: zammad-storage
          mountPath: /opt/zammad/storage
  containers:
    - name: railsserver
      image: ghcr.io/zammad/zammad:7.2.2-0000
      command: ["zammad-railsserver"]
      envFrom:
        - secretRef:
            name: zammad-env
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: zammad-storage
          mountPath: /opt/zammad/storage
    - name: websocket
      image: ghcr.io/zammad/zammad:7.2.2-0000
      command: ["zammad-websocket"]
      envFrom:
        - secretRef:
            name: zammad-env
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: zammad-storage
          mountPath: /opt/zammad/storage
    - name: scheduler
      image: ghcr.io/zammad/zammad:7.2.2-0000
      command: ["zammad-scheduler"]
      envFrom:
        - secretRef:
            name: zammad-env
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: zammad-storage
          mountPath: /opt/zammad/storage
    - name: nginx
      image: ghcr.io/zammad/zammad:7.2.2-0000
      command: ["zammad-nginx"]
      envFrom:
        - secretRef:
            name: zammad-env
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: zammad-storage
          mountPath: /opt/zammad/storage
  volumes:
    - name: zammad-storage
      emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zammad
  namespace: incident-tools
  annotations:
    ako.vmware.com/service-engine-group: goad-se-group
    external-dns.alpha.kubernetes.io/hostname: ${ZAMMAD_HOST}
spec:
  ingressClassName: avi-lb
  rules:
    - host: ${ZAMMAD_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zammad-nginx
                port:
                  number: 8080
