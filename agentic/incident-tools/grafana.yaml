apiVersion: v1
kind: Namespace
metadata:
  name: incident-tools
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: incident-tools
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Goad
        uid: goad-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.incident-tools.svc:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: incident-tools
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: goad
        folder: Goad
        type: file
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
