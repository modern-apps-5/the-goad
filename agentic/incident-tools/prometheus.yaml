# Live metrics for the Goad boards. The probe checks the demo pieces.
# QWEN_MODELS_URL is the Private AI models URL in this org. No secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: incident-tools
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: demo-probe
        static_configs:
          - targets: ["demo-probe.incident-tools.svc:9105"]
      - job_name: kube-state-metrics
        metrics_path: /metrics
        static_configs:
          - targets: ["prometheus-kube-state-metrics.tanzu-system-monitoring.svc:8080"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-probe
  namespace: incident-tools
data:
  probe.py: |
    #!/usr/bin/env python3
    """Readiness of the demo pieces. Writes no credentials."""
    import os
    import socket
    import ssl
    import threading
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    CHECKS = (
        ("store", os.environ.get("STORE_URL", "http://music-store-1-service.metal-music-store.svc:5000/")),
        ("users", os.environ.get("USERS_URL", "http://users-service.metal-music-store.svc:5003/health")),
        ("zammad", os.environ.get("ZAMMAD_URL", "http://zammad-nginx.incident-tools.svc:8080/")),
        ("qwen", os.environ.get("QWEN_MODELS_URL", "")),
        ("clm", os.environ.get("CLM_URL", "")),
    )
    CTX = ssl._create_unverified_context()
    LOCK = threading.Lock()
    STATE = {}

    def one(url: str, headers: dict | None = None) -> tuple[int, int]:
        if not url:
            return 0, 0
        start = time.monotonic()
        try:
            request = urllib.request.Request(url, headers=headers or {})
            with urllib.request.urlopen(request, timeout=20, context=CTX) as response:
                body = response.read(4000)
                ok = 200 <= response.status < 400
                if "models" in url and b"qwen" not in body:
                    ok = False
            return (1 if ok else 0), int((time.monotonic() - start) * 1000)
        except Exception:
            return 0, int((time.monotonic() - start) * 1000)

    def catalog() -> int:
        host = os.environ.get("CATALOG_HOST", "postgres-service.metal-music-store.svc")
        try:
            with socket.create_connection((host, 5432), 5):
                return 1
        except Exception:
            return 0

    def refresh() -> None:
        found = {}
        key = os.environ.get("QWEN_API_KEY", "").strip()
        for name, url in CHECKS:
            headers = {"Authorization": "Bearer " + key} if name == "qwen" and key else None
            up, ms = one(url, headers)
            found[name] = (up, ms)
        found["catalog"] = (catalog(), 0)
        with LOCK:
            STATE.clear()
            STATE.update(found)

    def loop() -> None:
        while True:
            refresh()
            time.sleep(30)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self) -> None:  # noqa: N802
            if self.path.split("?", 1)[0] != "/metrics":
                self.send_response(404)
                self.end_headers()
                return
            with LOCK:
                rows = dict(STATE)
            lines = [
                "# HELP demo_up 1 when that demo check succeeded.",
                "# TYPE demo_up gauge",
                "# HELP demo_latency_ms Time the check took.",
                "# TYPE demo_latency_ms gauge",
            ]
            for name, (up, ms) in sorted(rows.items()):
                lines.append(f'demo_up{{check="{name}"}} {up}')
                lines.append(f'demo_latency_ms{{check="{name}"}} {ms}')
            body = ("\n".join(lines) + "\n").encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt: str, *args) -> None:
            return

    def main() -> None:
        refresh()
        threading.Thread(target=loop, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", 9105), Handler).serve_forever()

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-probe
  namespace: incident-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-probe
  template:
    metadata:
      labels:
        app: demo-probe
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: python:3.12-slim
          command: ["python3", "/app/probe.py"]
          ports:
            - containerPort: 9105
          env:
            - name: QWEN_MODELS_URL
              value: ${QWEN_MODELS_URL}
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qwen-probe
                  key: api-key
            - name: CLM_URL
              value: ${CLM_HEALTH_URL}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9105
            periodSeconds: 10
          volumeMounts:
            - name: probe
              mountPath: /app
      volumes:
        - name: probe
          configMap:
            name: demo-probe
---
apiVersion: v1
kind: Service
metadata:
  name: demo-probe
  namespace: incident-tools
spec:
  selector:
    app: demo-probe
  ports:
    - name: metrics
      port: 9105
      targetPort: 9105
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: incident-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: incident-tools
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
