apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goad-k8s-mcp
  namespace: metal-music-app-agentic-system
  annotations:
    ako.vmware.com/service-engine-group: goad-se-group
    external-dns.alpha.kubernetes.io/hostname: ${K8S_MCP_HOST}
spec:
  ingressClassName: avi-lb
  rules:
    - host: ${K8S_MCP_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goad-k8s-mcp
                port:
                  number: 8080
---
