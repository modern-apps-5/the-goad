apiVersion: apps/v1
kind: Deployment
metadata:
  name: goad-vcf-mcp
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goad-vcf-mcp
  template:
    metadata:
      labels:
        app: goad-vcf-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: python:3.12-slim
          command: ["sh", "-c", "python3 -c 'import tarfile; tarfile.open(\"/bundle/package.tar\").extractall(\"/tmp/src\", filter=\"data\")' && pip install --user -q 'mcp>=2' 'httpx>=0.27' 'PyYAML>=6' 'uvicorn>=0.30' 'starlette>=0.37' 'PyJWT[crypto]>=2.8' && PYTHONPATH=/tmp/src PATH=\"$PATH:/tmp/.local/bin\" python3 -m vcf_mcp serve-http"]
          workingDir: /tmp
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOME
              value: /tmp
            - name: VCF_DISK_LATENCY_REPLAY
              value: "on"
            - name: VCF_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: vcf-read
            - name: VCF_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: vcf-admin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: code
              mountPath: /bundle
      volumes:
        - name: code
          configMap:
            name: mcp-vcf
---
apiVersion: v1
kind: Service
metadata:
  name: goad-vcf-mcp
  namespace: metal-music-app-agentic-system
spec:
  selector:
    app: goad-vcf-mcp
  ports:
    - port: 8080
      targetPort: 8080
