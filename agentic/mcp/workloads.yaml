apiVersion: apps/v1
kind: Deployment
metadata:
  name: goad-vcf-mcp
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goad-vcf-mcp
  template:
    metadata:
      labels:
        app: goad-vcf-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: python:3.12-slim
          command: ["python3", "/boot/boot.py"]
          workingDir: /tmp
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOME
              value: /tmp
            - name: VCF_DISK_LATENCY_REPLAY
              value: "on"
            - name: VCF_MCP_OAUTH_ISSUER
              value: https://${AGENTMINDER_HOST}/default
            - name: VCF_MCP_OAUTH_TLS_VERIFY
              value: "0"
            - name: VCF_MCP_OAUTH_AUDIENCES
              value: "${VCF_MCP_AUDIENCES}"
            - name: VCF_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: vcf-read
            - name: VCF_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: vcf-admin
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 60
            periodSeconds: 10
          volumeMounts:
            - name: code
              mountPath: /bundle
            - name: boot
              mountPath: /boot
            - name: specs
              mountPath: /spec-parts
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: mcp-vcf
        - name: boot
          configMap:
            name: mcp-vcf-boot
        - name: specs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: goad-vcf-mcp
  namespace: metal-music-app-agentic-system
spec:
  selector:
    app: goad-vcf-mcp
  ports:
    - port: 8080
      targetPort: 8080
