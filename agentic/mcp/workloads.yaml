apiVersion: apps/v1
kind: Deployment
metadata:
  name: goad-k8s-mcp
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goad-k8s-mcp
  template:
    metadata:
      labels:
        app: goad-k8s-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: python:3.12-slim
          command: ["python3", "/app/k8s_mcp.py"]
          workingDir: /app
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: 0.0.0.0
            - name: HOME
              value: /tmp
            - name: KUBECONFIG
              value: /kube/config
            - name: MCP_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: read
            - name: MCP_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: write
            - name: IDSP_ISSUER
              value: https://${AGENTMINDER_HOST}/default
            - name: IDSP_TLS_VERIFY
              value: "false"
            - name: MCP_RESOURCE_URL
              value: http://${K8S_MCP_HOST}/mcp
            - name: IDSP_GATEWAY_RESOURCE
              value: "${IDSP_GATEWAY_K8S}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - name: code
              mountPath: /app
            - name: kube
              mountPath: /kube
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: mcp-k8s
        - name: kube
          secret:
            secretName: guest-kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: goad-k8s-mcp
  namespace: metal-music-app-agentic-system
spec:
  selector:
    app: goad-k8s-mcp
  ports:
    - port: 8080
      targetPort: 8080
---
