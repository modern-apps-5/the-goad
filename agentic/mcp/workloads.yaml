apiVersion: apps/v1
kind: Deployment
metadata:
  name: goad-k8s-mcp
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goad-k8s-mcp
  template:
    metadata:
      labels:
        app: goad-k8s-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: python:3.12-slim
          command: ["python3", "/app/k8s_mcp.py"]
          workingDir: /app
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: 0.0.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: mcp-k8s
---
apiVersion: v1
kind: Service
metadata:
  name: goad-k8s-mcp
  namespace: metal-music-app-agentic-system
spec:
  selector:
    app: goad-k8s-mcp
  ports:
    - port: 8080
      targetPort: 8080
---
