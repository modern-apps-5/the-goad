apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metal-music-store

# The Red Lab store is gitops/music-store: the users VM Service VM,
# the DSM catalog, and the VKS cluster. Those files stay there.
# app/music-store is the earlier container shape. Do not apply it.
resources:
  - namespace.yaml
  - backing.yaml
  - ingress.yaml
