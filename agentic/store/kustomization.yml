apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metal-music-store

resources:
  - namespace.yaml
  - ../../app/music-store/k8s-deployment.yaml
  - ../../app/music-store/k8s-cart-deployment.yaml
  - ../../app/music-store/k8s-order-deployment.yaml
  - ../../app/music-store/k8s-chat-deployment.yaml
  - ../../app/music-store/k8s-traffic-generator-deployment.yaml
  - backing.yaml
  - ingress.yaml

patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: mgmt-cl01-optimal-datastore-default-policy-autoraid
