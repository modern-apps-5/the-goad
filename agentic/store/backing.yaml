# Points the shop at the VM Service users VM and the DSM catalog.
# Fill POSTGRES_HOST and USERS_HOST from BLANKS.md. Do not commit them.
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-service
subsets:
  - addresses:
      - ip: ${POSTGRES_HOST}
    ports:
      - name: postgres
        port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  ports:
    - name: http
      port: 5003
      targetPort: 5003
---
apiVersion: v1
kind: Endpoints
metadata:
  name: users-service
subsets:
  - addresses:
      - ip: ${USERS_HOST}
    ports:
      - name: http
        port: 5003
