# Points the shop at the VM Service users VM and the DSM catalog.
# The catalog address is the live PostgresCluster address in this org.
# USERS_HOST is the Goad VM Service address for music-users.
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-service
subsets:
  - addresses:
      - ip: 10.47.7.78
    ports:
      - name: postgres
        port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  ports:
    - name: http
      port: 5003
      targetPort: 5003
---
apiVersion: v1
kind: Endpoints
metadata:
  name: users-service
subsets:
  - addresses:
      - ip: 10.47.7.52
    ports:
      - name: http
        port: 5003
