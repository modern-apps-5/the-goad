apiVersion: v1
kind: Service
metadata:
  name: music-store-http
  namespace: metal-music-store
spec:
  selector:
    app: music-store-1
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metal-store
  namespace: metal-music-store
  annotations:
    ako.vmware.com/service-engine-group: goad-se-group
    external-dns.alpha.kubernetes.io/hostname: ${STORE_HOST}
spec:
  ingressClassName: avi-lb
  rules:
    - host: ${STORE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: music-store-http
                port:
                  number: 5000
