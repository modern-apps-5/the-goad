apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metal-store
  annotations:
    ako.vmware.com/service-engine-group: goad-se-group
    external-dns.alpha.kubernetes.io/hostname: ${STORE_HOST}
spec:
  ingressClassName: avi-lb
  rules:
    - host: ${STORE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: music-store-1-service
                port:
                  number: 5000
