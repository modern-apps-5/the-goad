# Orchestrator. The incident response agent calls POST /run.
# No Kubernetes, Avi, or VCF grant on this process.
---
applications:
  - name: metal-incident-live
    memory: 512M
    disk_quota: 1G
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 60
    command: python harness.py
    buildpacks:
      - python_buildpack
    routes:
      - route: metal-incident-live.${TANZU_APPS_DOMAIN}
