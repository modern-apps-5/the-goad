apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-response-agent
  namespace: metal-music-app-agentic-system
  annotations:
    ako.vmware.com/service-engine-group: goad-se-group
    external-dns.alpha.kubernetes.io/hostname: ${INCIDENT_HOST}
spec:
  ingressClassName: avi-lb
  rules:
    - host: ${INCIDENT_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: incident-response-agent
                port:
                  number: 8080
