apiVersion: v1
kind: Namespace
metadata:
  name: metal-music-app-agentic-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-response-agent
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-response-agent
  template:
    metadata:
      labels:
        app: incident-response-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: python:3.12-slim
          command: ["python3", "/app/chat.py"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ORCHESTRATOR_URL
              value: http://orchestrator:8080/run
            - name: ZAMMAD_URL
              valueFrom:
                secretKeyRef:
                  name: zammad-api
                  key: url
            - name: ZAMMAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zammad-api
                  key: token
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: code
              mountPath: /app
            - name: skill
              mountPath: /skills
      volumes:
        - name: code
          configMap:
            name: incident-chat
        - name: skill
          configMap:
            name: skill-incident-response
---
apiVersion: v1
kind: Service
metadata:
  name: incident-response-agent
  namespace: metal-music-app-agentic-system
spec:
  selector:
    app: incident-response-agent
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: python:3.12-slim
          command: ["python3", "/app/harness.py"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CLM_URL
              value: "${CLM_URL}"
            - name: CLM_MODEL
              value: clm-latest
            - name: STORE_URL
              valueFrom:
                secretKeyRef:
                  name: walk-targets
                  key: store-url
            - name: QWEN_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: qwen-model
                  key: base-url
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qwen-model
                  key: api-key
            - name: QWEN_MODEL
              valueFrom:
                secretKeyRef:
                  name: qwen-model
                  key: model
            - name: GRAFANA_URL
              value: http://grafana.incident-tools.svc:3000
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-annotator
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: orchestrator-code
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: metal-music-app-agentic-system
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8080
      targetPort: 8080
---
