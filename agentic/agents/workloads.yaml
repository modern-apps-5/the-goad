            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: code
              mountPath: /app
            - name: skill
              mountPath: /skills
