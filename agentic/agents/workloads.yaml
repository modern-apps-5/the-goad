apiVersion: v1
kind: Namespace
metadata:
  name: metal-music-app-agentic-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-response-agent
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-response-agent
  template:
    metadata:
      labels:
        app: incident-response-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: python:3.12-slim
          command: ["python3", "/app/idle.py"]
          ports:
            - containerPort: 8080
          env:
            - name: AGENT_NAME
              value: incident-response-agent
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: agent-idle
---
apiVersion: v1
kind: Service
metadata:
  name: incident-response-agent
  namespace: metal-music-app-agentic-system
spec:
  selector:
    app: incident-response-agent
  ports:
    - port: 8080
      targetPort: 8080
---
