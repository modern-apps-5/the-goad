<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>GOAD architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a6e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e3a6e" flood-opacity="0.12"/>
    </filter>
    <style>
      .box { fill: #ffffff; stroke: #1e3a6e; stroke-width: 1.4; filter: url(#shadow); }
      .pill { fill: #ffffff; stroke: #1e3a6e; stroke-width: 1.2; }
      .title { font-size: 14px; font-weight: 700; fill: #12233f; }
      .label { font-size: 13px; font-weight: 600; fill: #12233f; }
      .small { font-size: 11.5px; fill: #3b4a63; }
      .tag { font-size: 11.5px; font-weight: 600; fill: #1e3a6e; }
      .edge { fill: none; stroke: #1e3a6e; stroke-width: 1.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #6b4fa0; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .edgetext { font-size: 11px; fill: #3b4a63; font-style: italic; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1600" height="800" rx="18" fill="#ffffff"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#12233f">GOAD on VMware Cloud Foundation</text>
  <text x="40" y="76" class="small">A music store and the AI agents that operate it, on one private cloud</text>

  <!-- ===== platform layers ===== -->
  <rect x="160" y="722" width="1410" height="52" rx="10" fill="#f7f1fc" stroke="#b48ad6" stroke-width="1.4"/>
  <text x="865" y="753" text-anchor="middle" class="title">VMware Cloud Foundation</text>
  <rect x="200" y="733" width="110" height="30" rx="6" fill="#fdecec" stroke="#d94a4a" stroke-width="1.3"/>
  <text x="255" y="753" text-anchor="middle" class="label" fill="#b42323">vDefend</text>
  <rect x="325" y="733" width="90" height="30" rx="6" class="pill"/>
  <text x="370" y="753" text-anchor="middle" class="label">NSX</text>
  <rect x="430" y="733" width="150" height="30" rx="6" class="pill"/>
  <text x="505" y="753" text-anchor="middle" class="label">VCF Operations</text>

  <rect x="250" y="670" width="1320" height="40" rx="8" fill="#eef4fd" stroke="#8fb3e8" stroke-width="1.4"/>
  <text x="910" y="695" text-anchor="middle" class="title">vSphere Supervisor  ·  Argo CD  ·  Secret Store  ·  Harbor</text>

  <rect x="250" y="620" width="750" height="40" rx="8" fill="#eaf7ee" stroke="#6cbf84" stroke-width="1.4"/>
  <text x="625" y="645" text-anchor="middle" class="title">VCF Automation  ·  org goad</text>

  <rect x="1020" y="620" width="550" height="40" rx="8" fill="#fff4e6" stroke="#f0a64a" stroke-width="1.4"/>
  <text x="1295" y="645" text-anchor="middle" class="title">Tanzu Platform  ·  PaaS for AI workloads</text>

  <!-- ===== ingress ===== -->
  <ellipse cx="80" cy="400" rx="48" ry="32" class="box"/>
  <text x="80" y="405" text-anchor="middle" class="label">Users</text>

  <polygon points="150,400 165,370 215,370 230,400 215,430 165,430" class="box"/>
  <text x="190" y="397" text-anchor="middle" class="label">Avi</text>
  <text x="190" y="413" text-anchor="middle" class="small">LB + WAF</text>

  <path d="M128,400 L148,400" class="edge"/>
  <path d="M230,400 L263,400" class="edge"/>

  <!-- ===== org workloads ===== -->
  <!-- shop cluster -->
  <rect x="265" y="290" width="150" height="290" rx="10" class="box"/>
  <text x="340" y="314" text-anchor="middle" class="title">Music store</text>
  <rect x="285" y="332" width="110" height="34" rx="17" class="pill"/>
  <text x="340" y="354" text-anchor="middle" class="label">store</text>
  <rect x="285" y="376" width="110" height="34" rx="17" class="pill"/>
  <text x="340" y="398" text-anchor="middle" class="label">cart</text>
  <rect x="285" y="420" width="110" height="34" rx="17" class="pill"/>
  <text x="340" y="442" text-anchor="middle" class="label">order</text>
  <rect x="285" y="464" width="110" height="34" rx="17" class="pill"/>
  <text x="340" y="486" text-anchor="middle" class="label">chat</text>
  <text x="340" y="530" text-anchor="middle" class="small">Gateway API,</text>
  <text x="340" y="546" text-anchor="middle" class="small">Antrea policies</text>
  <rect x="265" y="586" width="150" height="24" rx="5" fill="#f4f7fb" stroke="#9fb3cf"/>
  <text x="340" y="603" text-anchor="middle" class="tag">VKS cluster</text>

  <!-- users VM -->
  <rect x="435" y="480" width="95" height="100" rx="10" class="box"/>
  <text x="482" y="522" text-anchor="middle" class="label">users</text>
  <text x="482" y="540" text-anchor="middle" class="label">service</text>
  <rect x="435" y="586" width="95" height="24" rx="5" fill="#f4f7fb" stroke="#9fb3cf"/>
  <text x="482" y="603" text-anchor="middle" class="tag">VM</text>

  <!-- catalog -->
  <rect x="545" y="480" width="95" height="100" rx="10" class="box"/>
  <text x="592" y="522" text-anchor="middle" class="label">catalog</text>
  <text x="592" y="540" text-anchor="middle" class="small">PostgreSQL</text>
  <rect x="545" y="586" width="95" height="24" rx="5" fill="#f4f7fb" stroke="#9fb3cf"/>
  <text x="592" y="603" text-anchor="middle" class="tag">DSM</text>

  <!-- qwen -->
  <rect x="655" y="480" width="95" height="100" rx="10" class="box"/>
  <text x="702" y="522" text-anchor="middle" class="label">Qwen</text>
  <text x="702" y="540" text-anchor="middle" class="small">private model</text>
  <rect x="655" y="586" width="95" height="24" rx="5" fill="#f4f7fb" stroke="#9fb3cf"/>
  <text x="702" y="603" text-anchor="middle" class="tag">Private AI</text>

  <polygon points="670,395 683,370 721,370 734,395 721,420 683,420" class="box"/>
  <text x="702" y="400" text-anchor="middle" class="label">Avi</text>
  <path d="M702,420 L702,478" class="edge"/>

  <!-- AgentMinder -->
  <rect x="765" y="480" width="105" height="100" rx="10" class="box"/>
  <text x="817" y="522" text-anchor="middle" class="label">AgentMinder</text>
  <text x="817" y="540" text-anchor="middle" class="small">agent governance</text>
  <rect x="765" y="586" width="105" height="24" rx="5" fill="#f4f7fb" stroke="#9fb3cf"/>
  <text x="817" y="603" text-anchor="middle" class="tag">VKS cluster</text>

  <!-- platform tools -->
  <rect x="885" y="480" width="105" height="100" rx="10" class="box"/>
  <text x="937" y="502" text-anchor="middle" class="label">Platform tools</text>
  <text x="937" y="522" text-anchor="middle" class="small">Zammad tickets</text>
  <text x="937" y="538" text-anchor="middle" class="small">Grafana</text>
  <text x="937" y="554" text-anchor="middle" class="small">Prometheus</text>
  <text x="937" y="570" text-anchor="middle" class="small">Tekton builds</text>
  <rect x="885" y="586" width="105" height="24" rx="5" fill="#f4f7fb" stroke="#9fb3cf"/>
  <text x="937" y="603" text-anchor="middle" class="tag">VKS cluster</text>

  <!-- shop calls -->
  <path d="M395,349 C440,349 482,400 482,478" class="edge"/>
  <path d="M395,393 C480,393 592,410 592,478" class="edge"/>
  <path d="M395,481 C520,481 560,395 668,395" class="edge"/>

  <!-- ===== Tanzu Platform: agents ===== -->
  <rect x="1020" y="200" width="550" height="410" rx="12" fill="#f3f8ff" stroke="#8fb3e8" stroke-width="1.4"/>
  <text x="1555" y="226" text-anchor="end" class="title">Incident AI agents</text>

  <rect x="1035" y="370" width="110" height="60" rx="10" fill="#f1ebfb" stroke="#6b4fa0" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="1090" y="396" text-anchor="middle" class="label">incident</text>
  <text x="1090" y="413" text-anchor="middle" class="label">response agent</text>

  <rect x="1170" y="270" width="110" height="50" rx="10" class="box"/>
  <text x="1225" y="292" text-anchor="middle" class="label">K8s</text>
  <text x="1225" y="308" text-anchor="middle" class="small">diagnostic agent</text>
  <rect x="1170" y="375" width="110" height="50" rx="10" class="box"/>
  <text x="1225" y="397" text-anchor="middle" class="label">Avi</text>
  <text x="1225" y="413" text-anchor="middle" class="small">diagnostic agent</text>
  <rect x="1170" y="480" width="110" height="50" rx="10" class="box"/>
  <text x="1225" y="502" text-anchor="middle" class="label">VCF</text>
  <text x="1225" y="518" text-anchor="middle" class="small">diagnostic agent</text>

  <path d="M1145,400 C1158,400 1155,295 1168,295" class="edge"/>
  <path d="M1145,400 L1168,400" class="edge"/>
  <path d="M1145,400 C1158,400 1155,505 1168,505" class="edge"/>

  <rect x="1300" y="270" width="72" height="260" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="1336" y="390" text-anchor="middle" class="label">Agent</text>
  <text x="1336" y="406" text-anchor="middle" class="label">Minder</text>
  <text x="1336" y="422" text-anchor="middle" class="small">gateway</text>

  <path d="M1280,295 L1298,295" class="edge"/>
  <path d="M1280,400 L1298,400" class="edge"/>
  <path d="M1280,505 L1298,505" class="edge"/>

  <rect x="1392" y="270" width="80" height="50" rx="10" class="box"/>
  <text x="1432" y="300" text-anchor="middle" class="label">K8s MCP</text>
  <rect x="1392" y="375" width="80" height="50" rx="10" class="box"/>
  <text x="1432" y="405" text-anchor="middle" class="label">Avi MCP</text>
  <rect x="1392" y="480" width="80" height="50" rx="10" class="box"/>
  <text x="1432" y="510" text-anchor="middle" class="label">VCF MCP</text>

  <path d="M1372,295 L1390,295" class="edge"/>
  <path d="M1372,400 L1390,400" class="edge"/>
  <path d="M1372,505 L1390,505" class="edge"/>

  <text x="1520" y="290" text-anchor="middle" class="small">VKS</text>
  <text x="1520" y="304" text-anchor="middle" class="small">clusters</text>
  <text x="1520" y="395" text-anchor="middle" class="small">Avi load</text>
  <text x="1520" y="409" text-anchor="middle" class="small">balancer</text>
  <text x="1520" y="500" text-anchor="middle" class="small">VCF</text>
  <text x="1520" y="514" text-anchor="middle" class="small">Operations</text>
  <path d="M1472,295 L1488,295" class="edge"/>
  <path d="M1472,400 L1488,400" class="edge"/>
  <path d="M1472,505 L1488,505" class="edge"/>

  <!-- agent links to the org -->
  <path d="M1090,370 L1090,150 L937,150 L937,478" class="dash"/>
  <text x="1013" y="142" text-anchor="middle" class="edgetext">reads the ticket and metrics</text>
  <path d="M1336,270 L1336,120 L817,120 L817,478" class="dash"/>
  <text x="1076" y="112" text-anchor="middle" class="edgetext">identities and tool policies</text>
  <path d="M1035,420 L1005,420 L1005,458 L740,458 L740,478" class="dash"/>
  <text x="872" y="451" text-anchor="middle" class="edgetext">model calls</text>
  <rect x="1195" y="582" width="200" height="24" rx="5" fill="#f4f7fb" stroke="#9fb3cf"/>
  <text x="1295" y="599" text-anchor="middle" class="tag">VKS runtime cluster</text>
</svg>
