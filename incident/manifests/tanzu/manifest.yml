# Metal Music App Agentic System.
# Space: ${GOAD_VCFA_SPACE} (org Goad). Not the Neuron space.
# Buildpacks match the earlier Tanzu agent demos: python, then agent_buildpack.
# The agent buildpack is the Pydantic agent. It is what shows tools in Debug.
# Client secrets and bearer tokens are set with cf set-env. Never here.
# push.py stages each role's AGENTS.md, then pushes that one app. While the
# AgentMinder issuer is down it stages the agents and leaves them stopped.
---
applications:
  - name: incident-response-agent
    path: ../../agents
    memory: 384M
    disk_quota: 1G
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 10
    buildpacks:
      - python_buildpack
      - agent_buildpack
    env:
      TANZU_AGENT_ENABLE_DEBUG_UI: "true"
      AGENTMINDER_CA_BUNDLE: /home/vcap/app/sidecar/lab-ca.pem
    routes:
      - route: incident-response-agent.${TANZU_APPS_DOMAIN}
    sidecars:
      - name: agentminder-sdk
        process_types: [web]
        command: bash sidecar/run-sidecar.sh
        memory: 128M
