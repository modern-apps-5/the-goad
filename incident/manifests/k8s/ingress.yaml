# Export record of the earlier host. Do not apply.
# The Goad ingress is incident/store/ingress.yaml on goad-se-group.
# Host that answered HTTPS 200 on 2026-10-11.
# The live Ingress object was not exported. The Kubernetes MCP has no
# ingress read. This records the host and the store service. It does not
# name a TLS secret, because that name was not captured.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metal-store
  namespace: metal-music-store
spec:
  ingressClassName: nginx
  rules:
    - host: ${STORE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: music-store-1-service
                port:
                  number: 5000
