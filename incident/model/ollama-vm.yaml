# DO NOT APPLY from this pull request.
#
# Ollama VM for qwen2.5:32b. Captain approved 2026-10-14: class
# best-effort-xlarge is 4 vCPU / 32 GiB. No GPU class. No password in
# this file.
#
# Apply into a new Supervisor namespace, prefix qwen, project
# default-project, VPC default-ans-cluster, zone west-1, seg_name
# goad-se-group, no reservation. Not private-ai. Argo CD must not sync
# gitops/private-ai for this VM.
#
# imageName is a display name. Import the Ubuntu 24.04 cloud image into
# that namespace under this name first. If the API rejects the extra
# 80 GiB volume, stop and set the root disk to at least 80 GiB before
# the model pull. Do not create a service engine group. The Service
# below uses the namespace group; skip it if that would create an engine.
apiVersion: v1
kind: Secret
metadata:
  name: goad-qwen-bootstrap
type: Opaque
stringData:
  user-data: |
    #cloud-config
    users:
      - name: ollama
        lock_passwd: true
        shell: /bin/bash
    package_update: false
    packages:
      - curl
    runcmd:
      - curl -fsSL https://ollama.com/install.sh | sh
      - mkdir -p /etc/systemd/system/ollama.service.d
      - printf '[Service]\nEnvironment="OLLAMA_HOST=0.0.0.0"\nEnvironment="OLLAMA_CONTEXT_LENGTH=4096"\n' > /etc/systemd/system/ollama.service.d/override.conf
      - systemctl daemon-reload
      - systemctl enable --now ollama
      - systemctl restart ollama
      - ollama pull qwen2.5:32b
---
apiVersion: vmoperator.vmware.com/v1alpha5
kind: VirtualMachine
metadata:
  name: goad-qwen
  labels:
    app: goad-qwen
spec:
  className: best-effort-xlarge
  imageName: ubuntu-24.04-cloud
  storageClass: mgmt-cl01-optimal-datastore-default-policy-autoraid
  powerState: PoweredOn
  volumes:
    - name: qwen-models
      capacity: 80Gi
  bootstrap:
    cloudInit:
      instanceID: goad-qwen-1
      rawCloudConfig:
        name: goad-qwen-bootstrap
        key: user-data
---
apiVersion: vmoperator.vmware.com/v1alpha5
kind: VirtualMachineService
metadata:
  name: goad-qwen
spec:
  type: LoadBalancer
  selector:
    app: goad-qwen
  ports:
    - name: ollama
      port: 11434
      protocol: TCP
      targetPort: 11434
