# DO NOT APPLY from this pull request.
#
# Guest cluster goad-store for the incident demo. Create the Supervisor
# namespace first (prefix store, project default-project, VPC
# default-ans-cluster, zone west-1, no CPU or memory reservation).
# Its seg_name is the existing goad-se-group. This Cluster object has
# no segName field. Do not create a service engine group.
#
# Replace REPLACE_WITH_STORE_SUPERVISOR_NAMESPACE with the generated
# namespace name before any create. Do not put this cluster in
# music-store-8q8l6 or private-ai-hphfz.
#
# classRef, storage class, and Ubuntu annotation match the guest cluster
# shape already used in this lab. If the supervisor rejects the version
# or the pod and service CIDRs, stop. Do not invent a class.
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: goad-store
  namespace: REPLACE_WITH_STORE_SUPERVISOR_NAMESPACE
  # Onboards the cluster to VCF Operations through the
  # platform-observability Supervisor Service.
  labels:
    addons.kubernetes.vmware.com/platform-observability: enabled
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.98.0.0/16"]
    services:
      cidrBlocks: ["10.115.0.0/12"]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.36.2+vmware.2
    variables:
      - name: vmClass
        value: best-effort-large
      - name: storageClass
        value: mgmt-cl01-optimal-datastore-default-policy-autoraid
      - name: kubernetes
        value:
          certificateRotation:
            enabled: true
            renewalDaysBeforeExpiry: 90
      - name: bootstrapAddons
        value:
          cniRef:
            name: antrea
            namespace: vmware-system-vks-public
    controlPlane:
      replicas: 1
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu, os-version=24.04
    workers:
      machineDeployments:
        - class: node-pool
          name: goad-store-np-1
          replicas: 2
          metadata:
            annotations:
              run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu, os-version=24.04
