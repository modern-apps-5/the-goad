# DO NOT APPLY from this pull request.
#
# Intended shape on cluster goad-store after images exist. Every image
# is example.invalid and is not a registry. Probes call /health only.
# They do not call the model. No LoadBalancer and no new service engine.
#
# VCF_DISK_LATENCY_REPLAY=on is the approved demo path. Live disk load
# stays off.
apiVersion: v1
kind: Namespace
metadata:
  name: metal-music-app-agentic-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-response-agent
  namespace: metal-music-app-agentic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-response-agent
  template:
    metadata:
      labels:
        app: incident-response-agent
    spec:
      containers:
        - name: agent
          image: example.invalid/goad/incident-response-agent:not-built
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_NAME
              value: incident-response-agent
            - name: PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 120
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: incident-response-agent
  namespace: metal-music-app-agentic-system
spec:
  type: ClusterIP
  selector:
    app: incident-response-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
---
