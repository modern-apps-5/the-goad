# Grafana unified-alerting file provisioning for the goad-qwen board.
# Datasource uid goad-prometheus must exist first.
# No pager is named here. The alert shows in the Grafana UI.
# Do not add a contact point in this pull request.
# Series are the Ollama VM, not a GPU exporter. They are not scraped yet.

apiVersion: 1
groups:
  - orgId: 1
    name: dgx
    folder: DGX spark1
    interval: 1m
    rules:
      - uid: dgx-busy
        title: DGX is busy
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: goad-prometheus
            model:
              editorMode: code
              expr: ollama_slot_busy
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: A request is in flight on goad-qwen. It is not demo-ready.
        labels:
          board: dgx
          check: busy
      - uid: dgx-memory-near-full
        title: goad-qwen host memory is near full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: goad-prometheus
            model:
              editorMode: code
              expr: ollama_host_memory_used_ratio >= bool 0.90
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: goad-qwen host memory used is at least 90 percent. It is not demo-ready. There is no GPU.
        labels:
          board: dgx
          check: memory
