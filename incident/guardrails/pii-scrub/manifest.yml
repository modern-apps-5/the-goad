# AI Services tile webhook. No secrets in this file.
# Push: ./departments/it/tanzu-pii/push.sh
# Tile Chat Base URL: https://pii-scrub.${TANZU_APPS_DOMAIN}

applications:
  - name: pii-scrub
    path: .
    memory: 512M
    disk_quota: 2G
    instances: 1
    timeout: 180
    buildpacks:
      - python_buildpack
    command: python app.py
    health-check-type: http
    health-check-http-endpoint: /health
    # Same 1s Diego miss as k8s-mcp: Presidio+spaCy boot exceeds default.
    health-check-invocation-timeout: 60
    routes:
      - route: pii-scrub.${TANZU_APPS_DOMAIN}
    env:
      PRESIDIO_LANGUAGE: en
      PRESIDIO_ENTITIES: PERSON,EMAIL_ADDRESS,PHONE_NUMBER,US_SSN,CREDIT_CARD
