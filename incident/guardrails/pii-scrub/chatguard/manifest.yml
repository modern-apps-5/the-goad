# Chat guard. No secrets. Push: ./departments/it/tanzu-pii/chatguard/push.sh
# Space: ${GOAD_VCFA_SPACE} (same space as the incident agent).
# The path route is NOT in this file. Map it only after /ready is ok:
#   cf map-route pii-chat-guard ${TANZU_APPS_DOMAIN} --hostname incident-response-agent --path api/chat
# Rollback:
#   cf unmap-route pii-chat-guard ${TANZU_APPS_DOMAIN} --hostname incident-response-agent --path api/chat

applications:
  - name: pii-chat-guard
    path: .
    memory: 256M
    disk_quota: 1G
    instances: 1
    timeout: 60
    buildpacks:
      - python_buildpack
    command: python app.py
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 2
    routes:
      - route: pii-chat-guard.${TANZU_APPS_DOMAIN}
    env:
      CHAT_ORIGIN: https://incident-response-agent-origin.${TANZU_APPS_DOMAIN}
