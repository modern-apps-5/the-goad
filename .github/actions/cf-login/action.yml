# Install the Tanzu cf CLI and log in to the GOAD foundation as goad-deployer.
#
# The foundation serves its own CLI with no login, at the URL that the CF API
# root lists as links.tanzu_cf_cli. It is always the foundation's version.
# There is no checksum file, so the step logs the sha256 and the version.
#
# goad-deployer is a Tanzu Hub OAuth app. The foundation takes only its
# client assertion secret (a private key), not the classic secret; the
# Tanzu cf CLI signs the assertion itself. For Terraform, which needs only
# a token, use the cf-token action instead.
#
# On a fresh HOME the CLI first installs its plugins, about 140 MB, even the
# core cf commands. HOME and CF_HOME are under the job's temp directory, on
# the runner's work disk: the container's own filesystem is small, and a
# runner pod was evicted for memory pressure during that install. The login
# never lands in the runner's real home.
name: cf-login
description: Install the Tanzu cf CLI and log in as goad-deployer.
inputs:
  client-id:
    description: goad-deployer's client ID (secret TANZU_HUB_CLIENT_ID).
    required: true
  client-assertion:
    description: goad-deployer's client assertion secret (secret TANZU_HUB_CLIENT_ASSERTION).
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CF_API: https://api.sys.goad.gpu.set.lab
        TANZUCF_CLIENT_ID: ${{ inputs.client-id }}
        TANZUCF_CLIENT_SECRET: ${{ inputs.client-assertion }}
      run: |
        set -euo pipefail
        bin=$RUNNER_TEMP/cf-cli
        export CF_HOME=$RUNNER_TEMP/cf-home HOME=$RUNNER_TEMP/home
        mkdir -p "$bin" "$CF_HOME" "$HOME"
        base=$(curl -skf "$CF_API/" | jq -r .links.tanzu_cf_cli.href)
        curl -skfL -o "$bin/cf.tgz" "$base/cf10-cli-linux-amd64.tar.gz"
        sha256sum "$bin/cf.tgz"
        tar xzf "$bin/cf.tgz" -C "$bin" && rm "$bin/cf.tgz"
        echo "$bin" >> "$GITHUB_PATH"
        echo "CF_HOME=$CF_HOME" >> "$GITHUB_ENV"
        echo "HOME=$HOME" >> "$GITHUB_ENV"
        "$bin/cf" version
        # Lab certificates are self-signed.
        "$bin/cf" api "$CF_API" --skip-ssl-validation
        "$bin/cf" auth --client-credentials
