# The cloud admin's four Terraform roots, on the lab's self-hosted runner.
# GitHub's own runners cannot reach VCF Automation or the lab's Gitea server.
#
# Four jobs, in order: org creates the org (terraform/cloud-admin/org),
# org-config configures things inside it (terraform/cloud-admin/org-config),
# agentminder installs AgentMinder on the cluster org-config made
# (terraform/cloud-admin/agentminder), and agentminder-registration
# registers the incident demo's agents in it
# (terraform/cloud-admin/agentminder-registration).
#
# It runs only when a person starts it: Actions, this workflow, Run workflow.
# It plans. It applies only if "apply" is ticked, and only on main. A pull
# request or a push starts nothing, for now: see decision 25.
#
# One workflow for each persona: this one never runs the platform engineer's
# root, and platform-engineer.yml never runs this one. See decision 25.
#
# The secrets are the team's shared values, the same ones as in
# terraform.tfvars and backend.hcl: see docs/terraform-state.md. A different
# value here changes what everyone else's apply set.
name: cloud-admin

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after the plan. Only on main.
        type: boolean
        default: false

permissions:
  contents: read

# One run of this root at a time. Gitea locks the state as well, but a queued
# run is easier to read than a lock error.
concurrency:
  group: cloud-admin
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Token of the shared Gitea user goad-terraform. The http backend reads it
  # from here, so there is no backend.hcl.
  TF_HTTP_PASSWORD: ${{ secrets.GITEA_STATE_TOKEN }}
  APPLY: ${{ github.ref == 'refs/heads/main' && inputs.apply }}

jobs:
  org:
    runs-on: [self-hosted, lab]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: terraform/cloud-admin/org
    env:
      # The provider administrator, admin in the System org.
      TF_VAR_vcfa_password: ${{ secrets.VCFA_ADMIN_PASSWORD }}
      # What Terraform sets for cloud-admin, the org's one local user.
      TF_VAR_cloud_admin_password: ${{ secrets.CLOUD_ADMIN_PASSWORD }}
      # The VCF Operations administrator. Terraform makes the org's VCF SSO
      # client through VCF Operations.
      TF_VAR_ops_password: ${{ secrets.OPS_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - run: terraform init
      - name: Plan
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          { echo '## org'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: env.APPLY == 'true'
        run: terraform apply -no-color -lock-timeout=5m tfplan

  org-config:
    needs: org
    runs-on: [self-hosted, lab]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: terraform/cloud-admin/org-config
    env:
      # cloud-admin, the user the org job made. Same value as there.
      TF_VAR_cloud_admin_password: ${{ secrets.CLOUD_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - run: terraform init
      - name: Plan
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          { echo '## org-config'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: env.APPLY == 'true'
        run: terraform apply -no-color -lock-timeout=5m tfplan

  agentminder:
    needs: org-config
    runs-on: [self-hosted, lab]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: terraform/cloud-admin/agentminder
    env:
      # cloud-admin, the user the org job made. Same value as there.
      TF_VAR_cloud_admin_password: ${{ secrets.CLOUD_ADMIN_PASSWORD }}
      # Login for Broadcom's AgentMinder image registry.
      TF_VAR_ssp_registry_username: ${{ secrets.SSP_REGISTRY_USERNAME }}
      TF_VAR_ssp_registry_password: ${{ secrets.SSP_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - run: terraform init
      - name: Plan
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          { echo '## agentminder'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: env.APPLY == 'true'
        run: terraform apply -no-color -lock-timeout=5m tfplan

  # Registers the incident demo's agents and MCP servers in AgentMinder, and
  # puts each agent's client in a user-provided service in the incident
  # apps' space (terraform/cloud-admin/agentminder-registration). See
  # decision 41.
  #
  # AgentMinder returns each app's client secret when the app is read, and
  # the restapi provider keeps the response in attributes it does not mark
  # sensitive. A plan prints their old values when they change, and an error
  # can print them too: "inconsistent result after apply" prints the whole
  # response. So this job never prints Terraform's output. The summary lists
  # only each resource and its action, and a failure prints only each
  # error's title and resource.
  agentminder-registration:
    needs: agentminder
    runs-on: [self-hosted, lab]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: terraform/cloud-admin/agentminder-registration
    env:
      # cloud-admin, the user the org job made. Same value as there.
      TF_VAR_cloud_admin_password: ${{ secrets.CLOUD_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      # cloudfoundry.tf: the cloudfoundry provider reads CF_ACCESS_TOKEN,
      # which this sets, for the am-* user-provided services. The token
      # lasts 30 minutes.
      - uses: ./.github/actions/cf-token
        with:
          client-assertion: ${{ secrets.TANZU_HUB_CLIENT_ASSERTION }}
      - run: terraform init
      # Prints only the lines that name an error and its resource, never a
      # value.
      - name: Error filter
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/errors-only" <<'EOF'
          #!/usr/bin/env bash
          grep -E '^(Error: |  with |When applying changes to [^ ,]+)' \
            | sed -E 's/^(When applying changes to [^ ,]+).*/\1/'
          echo "(Terraform's full error output is hidden: it can hold client secrets.)"
          EOF
          chmod +x "$RUNNER_TEMP/bin/errors-only"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Plan
        run: |
          set -euo pipefail
          terraform plan -no-color -lock-timeout=5m -out=tfplan > /dev/null 2> tf.err \
            || { errors-only < tf.err; exit 1; }
          {
            echo '## agentminder-registration'
            echo '```'
            terraform show -json tfplan | jq -r '
              [.resource_changes[] | select(.change.actions != ["no-op"])
               | "\(.change.actions | join(",")) \(.address)"]
              | if length == 0 then "No changes." else .[] end'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: env.APPLY == 'true'
        run: |
          terraform apply -no-color -lock-timeout=5m tfplan > /dev/null 2> tf.err \
            || { errors-only < tf.err; exit 1; }
