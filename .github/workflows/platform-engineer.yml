# The platform engineer's Terraform root, on the lab's self-hosted runner.
# GitHub's own runners cannot reach VCF Automation or the lab's Gitea server.
#
# It runs only when a person starts it: Actions, this workflow, Run workflow.
# It plans. It applies only if "apply" is ticked, and only on main. A pull
# request or a push starts nothing, for now: see decision 25.
#
# One workflow for each persona: this one never runs the cloud admin's root,
# and cloud-admin.yml never runs this one. See decision 25. The org must
# exist before this runs: on a first build, let the cloud admin's run finish,
# then start this one.
#
# The secrets are the team's shared values, the same ones as in
# terraform.tfvars, backend.hcl, and .secrets/: see docs/terraform-state.md.
# A different value here changes what everyone else's apply set.
name: platform-engineer

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after the plan. Only on main.
        type: boolean
        default: false

permissions:
  contents: read

# One run of this root at a time. Gitea locks the state as well, but a queued
# run is easier to read than a lock error.
concurrency:
  group: platform-engineer
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Token of the shared Gitea user goad-terraform. The http backend reads it
  # from here, so there is no backend.hcl.
  TF_HTTP_PASSWORD: ${{ secrets.GITEA_STATE_TOKEN }}
  APPLY: ${{ github.ref == 'refs/heads/main' && inputs.apply }}

jobs:
  terraform:
    runs-on: [self-hosted, lab]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: terraform/platform-engineer
    env:
      # API token of svc.platform_engineer@set.lab, the AD service account
      # that terraform/cloud-admin/org-config made an org administrator.
      TF_VAR_vcfa_api_token: ${{ secrets.PLATFORM_ENGINEER_VCFA_TOKEN }}
      TF_VAR_pais_admin_password_hash: ${{ secrets.PAIS_ADMIN_PASSWORD_HASH }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      # lab.auto.tfvars points at this file.
      - name: Write the deploy key
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s\n' "$GITOPS_DEPLOY_KEY" > .secrets/gitops-deploy-key
      - run: terraform init
      - name: Plan
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: env.APPLY == 'true'
        run: terraform apply -no-color -lock-timeout=5m tfplan
