# MCP doors for the Metal Music space.
# Same shape as the earlier demo MCP pushes: python_buildpack, HTTP /health.
# Routes are new because k8s-mcp and vcf-mcp already use the short names.
# push.py is the path. It stages each source tree and sets the tokens and
# controller passwords with the cf API. This file shows the same shape.
---
applications:
  - name: metal-k8s-mcp
    # Source: insightout-brain departments/it/mcp (same tree as k8s-mcp).
    memory: 128M
    disk_quota: 512M
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 10
    buildpacks:
      - python_buildpack
    command: python k8s_mcp.py
    routes:
      - route: metal-k8s-mcp.${TANZU_APPS_DOMAIN}
    services:
      - k8s-mcp-cluster
    env:
      MCP_RESOURCE_URL: https://metal-k8s-mcp.${TANZU_APPS_DOMAIN}/mcp
      IDSP_ISSUER: https://${AGENTMINDER_HOST}/default
  - name: metal-vcf-mcp
    # Source: mcp/vcf in this package, plus a hosts.json you fill
    # from the Goad inventory. hosts.json stays out of git.
    memory: 1G
    disk_quota: 2G
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 10
    buildpacks:
      - python_buildpack
    command: python -m vcf_mcp serve-http
    routes:
      - route: metal-vcf-mcp.${TANZU_APPS_DOMAIN}
    env:
      PYTHONUNBUFFERED: "1"
      VCF_MCP_HOSTS_FILE: /home/vcap/app/hosts.json
      VCF_MCP_SPEC_DIR: /home/vcap/app/specs
      VCF_ALLOWED_HOSTS: metal-vcf-mcp.${TANZU_APPS_DOMAIN}
      VCF_MCP_RESOURCE_URL: https://metal-vcf-mcp.${TANZU_APPS_DOMAIN}/mcp
      VCF_MCP_AUDIT_LOG: /dev/stdout
      VCF_MCP_VERIFY_TLS: "0"
  - name: metal-avi-mcp
    # Source: avi-mcp/ in this repo. Standard library only.
    memory: 128M
    disk_quota: 512M
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /health
    health-check-invocation-timeout: 10
    buildpacks:
      - python_buildpack
    command: python server.py
    routes:
      - route: metal-avi-mcp.${TANZU_APPS_DOMAIN}
    env:
      AVI_CONTROLLER: ${AVI_CONTROLLER_HOST}
      AVI_USERNAME: admin
      MCP_RESOURCE_URL: https://metal-avi-mcp.${TANZU_APPS_DOMAIN}/mcp
      IDSP_ISSUER: https://${AGENTMINDER_HOST}/default
