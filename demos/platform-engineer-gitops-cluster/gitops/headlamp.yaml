# Headlamp, a Kubernetes UI in the browser, on the VKS cluster vks-addons, from the VKS addon. Default values.
#
# The release is pinned. A ClusterAddon does not move to a newer release
# by itself. README.md says how to find the release to put here.
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: headlamp
spec:
  addonRef:
    name: headlamp
  releaseFilter:
    ref:
      name: RELEASE_FROM_LAB
  crossNamespaceSelection: Blocked
  stopMatchingBehavior: Delete
  clusters:
    - selector:
        matchLabels:
          addons.kubernetes.vmware.com/headlamp: enabled
