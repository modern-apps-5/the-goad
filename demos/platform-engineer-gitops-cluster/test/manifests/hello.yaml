# The test workload Application B deploys into the VKS cluster: a single
# unprivileged nginx, in namespace demo (the Application makes the
# namespace). It only shows that Argo CD can deploy into the cluster
# through the ManagedEntity target. Nothing depends on it.
#
# nginx-unprivileged listens on 8080 and runs as a non-root user, so it
# passes a restricted Pod Security namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: demo
  labels:
    app: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: demo
spec:
  selector:
    app: hello
  ports:
    - name: http
      port: 80
      targetPort: 8080
